syntax = "proto3";

package wfa.measurement.api.v2alpha.event_templates.testing;

import "wfa/measurement/api/v2alpha/event_annotations.proto";

option java_package = "org.wfanet.measurement.api.v2alpha.event_templates.testing";
option java_multiple_files = true;

message VersionedCommon {
  option (.wfa.measurement.api.v2alpha.event_template) = {
    name: "versioned_common"
    display_name: "Versioned Common"
  };

  enum Segment {
    SEGMENT_UNSPECIFIED = 0;
    SEGMENT_A = 1;
    SEGMENT_B = 2;
  }

  Segment original = 1 [(.wfa.measurement.api.v2alpha.template_field) = {
    display_name: "Original"
    population_attribute: true
    version_added: 1
  }];

  Segment later = 2 [(.wfa.measurement.api.v2alpha.template_field) = {
    display_name: "Later"
    population_attribute: true
    version_added: 2
  }];

  Segment retired = 3 [(.wfa.measurement.api.v2alpha.template_field) = {
    display_name: "Retired"
    population_attribute: true
    version_added: 1
    version_removed: 3
  }];
}

message VersionedEvent {
  option (.wfa.measurement.api.v2alpha.event) = {
    current_version: 3
  };

  VersionedCommon versioned_common = 1;
}
