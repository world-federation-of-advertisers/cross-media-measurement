syntax = "proto3";

package wfa.measurement.config.edpaggregator;

import "google/api/resource.proto";
import "wfa/measurement/config/edpaggregator/transport_layer_security_params.proto";
import "wfa/measurement/edpaggregator/v1alpha/results_fulfiller_params.proto";

option java_package = "org.wfanet.measurement.config.edpaggregator";
option java_multiple_files = true;
option java_outer_classname = "RequisitionFetcherDirectDispatchConfigProto";

// Direct WorkItem dispatch configuration for one EDP.
message RequisitionWorkItemDispatchConfig {
  // DataProvider whose grouped requisitions use direct dispatch.
  string data_provider = 1
      [(google.api.resource_reference).type = "halo.wfanet.org/DataProvider"];

  // How the EDP connects to the Secure Computation Control Plane Public API.
  TransportLayerSecurityParams control_plane_connection = 2;

  // Queue for ResultsFulfiller WorkItems.
  string queue = 3 [(google.api.resource_reference).type =
                        "control-plane.secure-computation.halo-cmm.org/Queue"];

  // Parameters for the ResultsFulfiller application.
  wfa.measurement.edpaggregator.v1alpha.ResultsFulfillerParams
      results_fulfiller_params = 4;

  // Storage path prefix reserved for direct WorkItem dispatch.
  //
  // This must differ from the legacy DataWatcher path in the matching
  // DataProviderRequisitionConfig.storage_path_prefix.
  string storage_path_prefix = 5;
}

// Direct WorkItem dispatch configuration for RequisitionFetcher.
//
// DataProviders omitted from this message continue to use legacy DataWatcher
// dispatch.
message RequisitionFetcherDirectDispatchConfig {
  // Configuration for each EDP using direct dispatch.
  repeated RequisitionWorkItemDispatchConfig configs = 1;
}
