syntax = "proto3";

package wfa.measurement.config.edpaggregator;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/duration.proto";
import "wfa/measurement/config/edpaggregator/storage_params.proto";
import "wfa/measurement/config/edpaggregator/transport_layer_security_params.proto";
import "wfa/measurement/edpaggregator/v1alpha/results_fulfiller_params.proto";

option java_package = "org.wfanet.measurement.config.edpaggregator";
option java_multiple_files = true;
option java_outer_classname = "RequisitionFetcherConfigProto";

// Configuration for direct ResultsFulfiller WorkItem dispatch.
message RequisitionWorkItemDispatchConfig {
  // Storage path prefix reserved for directly dispatched groups.
  //
  // This must not overlap any legacy or direct-dispatch path prefix that uses
  // the same storage namespace. No legacy DataWatcher source_path_regex may
  // match this prefix. Keep this unchanged while any recoverable group uses it:
  // RequisitionFetcher identifies direct groups by comparing their persisted
  // `blob_uri` with the URI derived from this prefix.
  string storage_path_prefix = 1;

  // How the EDP connects to the Secure Computation Control Plane Public API.
  TransportLayerSecurityParams control_plane_connection = 2;

  // Queue for ResultsFulfiller WorkItems.
  string queue = 3 [(google.api.resource_reference).type =
                        "control-plane.secure-computation.halo-cmm.org/Queue"];

  // Parameters passed from RequisitionFetcher to ResultsFulfiller.
  wfa.measurement.edpaggregator.v1alpha.ResultsFulfillerParams
      results_fulfiller_params = 4;
}

// Individual config per EDP.
message DataProviderRequisitionConfig {
  // Data Provider Name
  string data_provider = 1
      [(google.api.resource_reference).type = "halo.wfanet.org/DataProvider"];
  // Requisition storage
  StorageParams requisition_storage = 2;
  // Storage path prefix
  string storage_path_prefix = 3;
  // How the EDP connects to the CMMS Public API
  TransportLayerSecurityParams cmms_connection = 4;
  // The path to the EDP private key to group requisitions
  string edp_private_key_path = 5;
  // How the EDP connects to the Requisition Metadata Storage Public API
  TransportLayerSecurityParams requisition_metadata_storage_connection = 6;
  // Direct WorkItem dispatch configuration for newly fetched requisitions.
  RequisitionWorkItemDispatchConfig work_item_dispatch = 7
      [(google.api.field_behavior) = REQUIRED];
}

// The Requisition Fetcher configuration
message RequisitionFetcherConfig {
  // All the configs per EDP
  repeated DataProviderRequisitionConfig configs = 1;

  // Maximum age of an unfulfilled Requisition before RequisitionFetcher
  // refuses it with DECLINED justification.
  //
  // Age is measured from the Requisition's Kingdom `update_time`. If this
  // field is absent, RequisitionFetcher uses 48 hours. If present, the value
  // must be positive. A Requisition without a valid `update_time` is not
  // refused automatically.
  google.protobuf.Duration requisition_refusal_duration = 2
      [(google.api.field_behavior) = OPTIONAL];
}
