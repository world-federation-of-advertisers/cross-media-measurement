syntax = "proto3";

package wfa.measurement.config.edpaggregator;

option java_package = "org.wfanet.measurement.config.edpaggregator";
option java_multiple_files = true;
option java_outer_classname = "EventGroupReferenceIdEntityKeyMappingProto";

// Mapping between an event-group reference ID and an entity key.
message EventGroupReferenceIdEntityKeyMapping {
  // Entity type whose IDs are equivalent to event-group reference IDs.
  string entity_type = 1;

  // Optional prefix on event-group reference IDs.
  //
  // Conversion removes this prefix when converting from a reference ID and
  // adds it when converting to one. When empty, reference IDs remain mappable.
  string event_group_reference_id_prefix = 2;

  // Optional prefix on entity IDs.
  //
  // Conversion removes this prefix when converting from an entity ID and adds
  // it when converting to one. When empty, entity IDs remain mappable.
  string entity_id_prefix = 3;
}
