syntax = "proto3";

package wfa.measurement.config.reporting;

import "google/api/resource.proto";

option java_package = "org.wfanet.measurement.config.reporting";
option java_multiple_files = true;
option java_outer_classname = "ReportTraceTopologyConfigProto";

// Complete DataProvider fulfillment topology used by the report-trace operator
// tool. EDPA means the supported direct RequisitionFetcher-to-Secure-
// Computation dispatch path; legacy DataWatcher dispatch is not supported.
message ReportTraceTopologyConfig {
  // Routes for all DataProviders in the deployment.
  repeated DataProviderRoute data_provider_routes = 1;
}

// How one DataProvider fulfills Requisitions.
message DataProviderRoute {
  enum Route {
    // Invalid. Every DataProvider route must be specified explicitly.
    ROUTE_UNSPECIFIED = 0;

    // The DataProvider fulfills Requisitions without an EDP Aggregator.
    DIRECT_EDP = 1;

    // The DataProvider uses an EDP Aggregator with direct Secure Computation
    // WorkItem dispatch.
    EDPA = 2;
  }

  // DataProvider resource name.
  string data_provider = 1
      [(google.api.resource_reference).type = "halo.wfanet.org/DataProvider"];

  // Fulfillment route. ROUTE_UNSPECIFIED is invalid.
  Route route = 2;
}
