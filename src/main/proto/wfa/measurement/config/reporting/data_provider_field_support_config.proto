syntax = "proto3";

package wfa.measurement.config.reporting;

import "google/type/interval.proto";

option java_package = "org.wfanet.measurement.config.reporting";
option java_multiple_files = true;
option java_outer_classname = "DataProviderFieldSupportConfigProto";

// Declares which real event template fields each DataProvider supports,
// and over which date ranges.
//
// A DataProvider supports a field for a reporting window only if a single
// FieldSupport entry's date range covers the entire window. A DataProvider
// with no FieldSupport entry for a field does not support it.
//
// Virtual dimensions are never listed. Support for a virtual dimension is
// derived from the support of the real fields used in each of its
// definitions.
message DataProviderFieldSupportConfig {
  // The fields supported by a single DataProvider.
  message DataProviderFieldSupport {
    // Resource name of the DataProvider.
    string data_provider = 1;

    // Each field this DataProvider supports, with its period of support.
    repeated FieldSupport field_support = 2;
  }

  // Support for a single field over a time interval.
  message FieldSupport {
    // A field path with respect to the local market Event message with `.`
    // as the traversal operator, e.g. `common.us_state`.
    //
    // The field at this path must be tagged GROUPABLE. It may be real or
    // virtual. There may be at most one policy per field path.
    // Must reference a non-virtual field.
    string field_path = 1;

    // Interval over which the field is supported. Required.
    google.type.Interval supported_interval = 2;
  }

  repeated DataProviderFieldSupport data_provider_field_supports = 1;
}
