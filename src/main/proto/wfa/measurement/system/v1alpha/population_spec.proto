syntax = "proto3";

package wfa.measurement.system.v1alpha;

import "google/protobuf/any.proto";

option java_package = "org.wfanet.measurement.system.v1alpha";
option java_multiple_files = true;
option java_outer_classname = "PopulationSpecProto";

// The System API copy of [wfa.measurement.api.v2alpha.PopulationSpec][],
// resolved by the Kingdom from the `Measurement`'s model line.
message PopulationSpec {
  // A range of Virtual Person IDs (VIDs).
  message VidRange {
    // The starting ID for this range of VIDs.
    int64 start_vid = 1;
    // The ending ID for this range of VIDs, inclusive.
    int64 end_vid_inclusive = 2;
  }

  // A sub-population, composed of a set of [VidRange][]s that share the same
  // attributes.
  message SubPopulation {
    // The unique attributes of the sub-population, each a packed event
    // template message.
    repeated google.protobuf.Any attributes = 1;

    // The set of disjoint VID ranges for this sub-population.
    repeated VidRange vid_ranges = 2;
  }

  // The [SubPopulation][]s that comprise this [PopulationSpec][].
  repeated SubPopulation subpopulations = 3;
}
