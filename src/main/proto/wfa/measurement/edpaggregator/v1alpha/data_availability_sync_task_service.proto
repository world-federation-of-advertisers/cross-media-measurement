syntax = "proto3";

package wfa.measurement.edpaggregator.v1alpha;

import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/type/interval.proto";
import "wfa/measurement/edpaggregator/v1alpha/data_availability_sync_task.proto";

option java_package = "org.wfanet.measurement.edpaggregator.v1alpha";
option java_multiple_files = true;
option java_outer_classname = "DataAvailabilitySyncTaskServiceProto";

// Service for durable data-availability synchronization tasks.
service DataAvailabilitySyncTaskService {
  // Creates a task in the `PENDING` state.
  rpc CreateDataAvailabilitySyncTask(CreateDataAvailabilitySyncTaskRequest)
      returns (DataAvailabilitySyncTask) {}

  // Retrieves a task.
  rpc GetDataAvailabilitySyncTask(GetDataAvailabilitySyncTaskRequest)
      returns (DataAvailabilitySyncTask) {}

  // Lists tasks for a raw impression upload.
  rpc ListDataAvailabilitySyncTasks(ListDataAvailabilitySyncTasksRequest)
      returns (ListDataAvailabilitySyncTasksResponse) {}

  // Marks a task as running and increments its attempt count.
  rpc MarkDataAvailabilitySyncTaskRunning(
      MarkDataAvailabilitySyncTaskRunningRequest)
      returns (DataAvailabilitySyncTask) {}

  // Marks a task as succeeded.
  rpc MarkDataAvailabilitySyncTaskSucceeded(
      MarkDataAvailabilitySyncTaskSucceededRequest)
      returns (DataAvailabilitySyncTask) {}

  // Marks a task as failed.
  rpc MarkDataAvailabilitySyncTaskFailed(
      MarkDataAvailabilitySyncTaskFailedRequest)
      returns (DataAvailabilitySyncTask) {}
}

// Request message for `CreateDataAvailabilitySyncTask`.
message CreateDataAvailabilitySyncTaskRequest {
  // Parent raw impression upload resource name.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      child_type: "edpaggregator.halo-cmm.org/DataAvailabilitySyncTask"
    }
  ];

  // Task to create. The `name` and output-only fields are ignored.
  DataAvailabilitySyncTask data_availability_sync_task = 2
      [(google.api.field_behavior) = REQUIRED];

  // Client-assigned deterministic task resource ID. This is the UUID4-layout
  // value formed from the first 16 bytes of SHA-256 of
  // `dataAvailabilitySyncTask:<path_hash>:<generation>`, with RFC 4122 version
  // and variant bits applied. `path_hash` is the lowercase hexadecimal SHA-256
  // of the full `gs://bucket/object` URI after lowercasing its scheme.
  string data_availability_sync_task_id = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];

  // UUID4 used to make retries idempotent. It must equal
  // `data_availability_sync_task_id`.
  // (-- api-linter: core::0133::request-required-fields=disabled
  //     aip.dev/not-precedent: request_id is intentionally REQUIRED so the
  //     server can deduplicate retries of this server-named resource. --)
  string request_id = 4 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];
}

// Request message for `GetDataAvailabilitySyncTask`.
message GetDataAvailabilitySyncTaskRequest {
  // Resource name of the task.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "edpaggregator.halo-cmm.org/DataAvailabilitySyncTask"
    }
  ];
}

// Request message for `ListDataAvailabilitySyncTasks`.
// (-- api-linter: core::0132::request-field-types=disabled
//     aip.dev/not-precedent: A structured filter is used consistently by the
//     other EDPA resource APIs. --)
message ListDataAvailabilitySyncTasksRequest {
  // Parent raw impression upload resource name. The upload segment may be `-`
  // to list tasks across all uploads for the data provider.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      child_type: "edpaggregator.halo-cmm.org/DataAvailabilitySyncTask"
    }
  ];

  // Maximum number of tasks to return.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Token from a previous list response.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Structured task filters.
  message Filter {
    // Processing state to match.
    // (-- api-linter: core::0216::state-field-output-only=disabled
    //     aip.dev/not-precedent: This field filters resource state. --)
    DataAvailabilitySyncTask.State state = 1
        [(google.api.field_behavior) = OPTIONAL];

    // Creation-time interval to match.
    google.type.Interval create_time_interval = 2
        [(google.api.field_behavior) = OPTIONAL];

    // CMMS model line to match.
    string cmms_model_line = 3 [
      (google.api.field_behavior) = OPTIONAL,
      (google.api.resource_reference) = { type: "halo.wfanet.org/ModelLine" }
    ];
  }

  // Filters applied to the result set.
  Filter filter = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for `ListDataAvailabilitySyncTasks`.
message ListDataAvailabilitySyncTasksResponse {
  // Matching tasks.
  repeated DataAvailabilitySyncTask data_availability_sync_tasks = 1;

  // Token for the next page.
  string next_page_token = 2;
}

// Request message for `MarkDataAvailabilitySyncTaskRunning`.
message MarkDataAvailabilitySyncTaskRunningRequest {
  // Resource name of the task.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "edpaggregator.halo-cmm.org/DataAvailabilitySyncTask"
    }
  ];
  // Etag for optimistic concurrency control.
  string etag = 2 [(google.api.field_behavior) = REQUIRED];
  // UUID4 used to make retries idempotent.
  string request_id = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];
}

// Request message for `MarkDataAvailabilitySyncTaskSucceeded`.
message MarkDataAvailabilitySyncTaskSucceededRequest {
  // Resource name of the task.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "edpaggregator.halo-cmm.org/DataAvailabilitySyncTask"
    }
  ];
  // Etag for optimistic concurrency control.
  string etag = 2 [(google.api.field_behavior) = REQUIRED];
  // UUID4 used to make retries idempotent.
  string request_id = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];
}

// Request message for `MarkDataAvailabilitySyncTaskFailed`.
message MarkDataAvailabilitySyncTaskFailedRequest {
  // Resource name of the task.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "edpaggregator.halo-cmm.org/DataAvailabilitySyncTask"
    }
  ];
  // Category of the task failure.
  DataAvailabilitySyncTask.FailureCategory failure_category = 2
      [(google.api.field_behavior) = REQUIRED];
  // Etag for optimistic concurrency control.
  string etag = 3 [(google.api.field_behavior) = REQUIRED];
  // UUID4 used to make retries idempotent.
  string request_id = 4 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];
}
