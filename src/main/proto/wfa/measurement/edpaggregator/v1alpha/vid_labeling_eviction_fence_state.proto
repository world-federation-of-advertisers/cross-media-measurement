syntax = "proto3";

package wfa.measurement.edpaggregator.v1alpha;

option java_package = "org.wfanet.measurement.edpaggregator.v1alpha";
option java_multiple_files = true;
option java_outer_classname = "VidLabelingEvictionFenceStateProto";

enum VidLabelingEvictionFenceState {
  // The fence state is unknown.
  VID_LABELING_EVICTION_FENCE_STATE_UNSPECIFIED = 0;

  // The fence blocks new work while a correction plan awaits approval.
  VID_LABELING_EVICTION_FENCE_STATE_APPROVAL_PENDING = 1;

  // The fence blocks new work while existing work and synchronization leases
  // drain.
  VID_LABELING_EVICTION_FENCE_STATE_DRAINING = 2;

  // The fence permits healing mutations after all conflicting work has drained.
  VID_LABELING_EVICTION_FENCE_STATE_EVICTING = 3;
}
