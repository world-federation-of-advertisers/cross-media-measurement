syntax = "proto3";

package wfa.measurement.edpaggregator.v1alpha;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "wfa/measurement/securecomputation/controlplane/v1alpha/work_item.proto";

option java_package = "org.wfanet.measurement.edpaggregator.v1alpha";
option java_multiple_files = true;
option java_outer_classname = "VidLabelingDispatcherParamsProto";

// Parameters sent by the DataWatcher to the VID Labeling Dispatcher cloud
// function. The dispatcher uses the data_provider to look up the matching
// VidLabelingConfig and build the VidLabelerParams for the TEE application.
message VidLabelingDispatcherParams {
  // Resource name of the DataProvider.
  string data_provider = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "halo.wfanet.org/DataProvider"
  ];
}

// Parameters persisted for one raw-upload dispatch or authorized recovery
// replay.
message VidLabelingDispatchWorkItemParams {
  // Resource name of the DataProvider whose configured dispatcher handles this
  // upload.
  string data_provider = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "halo.wfanet.org/DataProvider"
  ];

  reserved 2, 3, 4;
  reserved "override_model_lines", "recovery_source_upload",
      "eviction_operation_id";

  // Exact finalized source-object version.
  wfa.measurement.securecomputation.controlplane.v1alpha.WorkItem.WorkItemParams
      .DataPathParams source = 5 [(google.api.field_behavior) = REQUIRED];

  // Authorization for a recovery replay. Absent for ordinary uploads.
  RecoveryParams recovery = 6 [(google.api.field_behavior) = OPTIONAL];

  // Authorization for replaying an evicted upload.
  message RecoveryParams {
    // Resource names of the ModelLines authorized for replay.
    repeated string override_model_lines = 1 [
      (google.api.field_behavior) = REQUIRED,
      (google.api.resource_reference).type = "halo.wfanet.org/ModelLine"
    ];

    // Resource name of the evicted RawImpressionUpload under data_provider.
    string source_upload = 2 [
      (google.api.field_behavior) = REQUIRED,
      (google.api.resource_reference).type =
          "edpaggregator.halo-cmm.org/RawImpressionUpload"
    ];

    // Resource name of the authorizing UploadHealingOperation under
    // data_provider.
    string upload_healing_operation = 3 [
      (google.api.field_behavior) = REQUIRED,
      (google.api.resource_reference).type =
          "edpaggregator.halo-cmm.org/UploadHealingOperation"
    ];
  }
}
