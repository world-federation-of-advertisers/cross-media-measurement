syntax = "proto3";

package wfa.measurement.edpaggregator.v1alpha;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/type/date.proto";

option java_package = "org.wfanet.measurement.edpaggregator.v1alpha";
option java_multiple_files = true;
option java_outer_classname = "ModelLineCutoverProto";

// Routes one external model line between two internal model lines at a UTC
// date boundary.
message ModelLineCutover {
  // Model line used in requisitions and published data availability.
  string external_model_line = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "halo.wfanet.org/ModelLine"
  ];

  // Internal model line used for event times before `cutover_date`.
  string historical_model_line = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "halo.wfanet.org/ModelLine"
  ];

  // Internal model line used for event times on or after `cutover_date`.
  string replacement_model_line = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "halo.wfanet.org/ModelLine"
  ];

  // First UTC date whose impressions are read from
  // `replacement_model_line`.
  google.type.Date cutover_date = 4 [(google.api.field_behavior) = REQUIRED];
}
