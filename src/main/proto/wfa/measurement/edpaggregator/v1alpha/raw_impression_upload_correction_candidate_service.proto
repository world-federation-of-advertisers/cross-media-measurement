syntax = "proto3";

package wfa.measurement.edpaggregator.v1alpha;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "wfa/measurement/edpaggregator/v1alpha/raw_impression_upload_correction_candidate.proto";

option java_package = "org.wfanet.measurement.edpaggregator.v1alpha";
option java_multiple_files = true;
option java_outer_classname = "RawImpressionUploadCorrectionCandidateServiceProto";

// Service for inspecting raw-impression upload correction candidates.
service RawImpressionUploadCorrectionCandidateService {
  // Retrieves a correction candidate with its manifest differences.
  rpc GetRawImpressionUploadCorrectionCandidate(
      GetRawImpressionUploadCorrectionCandidateRequest)
      returns (RawImpressionUploadCorrectionCandidate) {}

  // Lists correction candidates without raw-object URIs.
  rpc ListRawImpressionUploadCorrectionCandidates(
      ListRawImpressionUploadCorrectionCandidatesRequest)
      returns (ListRawImpressionUploadCorrectionCandidatesResponse) {}
}

// Request message for `GetRawImpressionUploadCorrectionCandidate`.
message GetRawImpressionUploadCorrectionCandidateRequest {
  // Resource name of the correction candidate.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "edpaggregator.halo-cmm.org/RawImpressionUploadCorrectionCandidate"
    }
  ];
}

// Request message for `ListRawImpressionUploadCorrectionCandidates`.
// (-- api-linter: core::0132::request-field-types=disabled
//     aip.dev/not-precedent: The structured filter matches existing EDPA APIs.
//     --)
message ListRawImpressionUploadCorrectionCandidatesRequest {
  // Parent data provider resource name.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      child_type: "edpaggregator.halo-cmm.org/RawImpressionUploadCorrectionCandidate"
    }
  ];

  // Maximum number of results to return.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Page token received from a previous list request.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  message Filter {
    // Candidate lifecycle states to include.
    repeated RawImpressionUploadCorrectionCandidate.State state_in = 1
        [(google.api.field_behavior) = OPTIONAL];

    // Candidate classifications to include.
    repeated RawImpressionUploadCorrectionCandidate.Classification
        classification_in = 2 [(google.api.field_behavior) = OPTIONAL];
  }

  // Filter applied to the candidate collection.
  Filter filter = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for `ListRawImpressionUploadCorrectionCandidates`.
message ListRawImpressionUploadCorrectionCandidatesResponse {
  // Matching correction candidates without manifest differences.
  repeated RawImpressionUploadCorrectionCandidate
      raw_impression_upload_correction_candidates = 1;

  // Token for retrieving the next page.
  string next_page_token = 2;
}
