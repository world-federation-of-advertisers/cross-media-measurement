syntax = "proto3";

package wfa.measurement.internal.securecomputation.controlplane;

import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "wfa/measurement/internal/securecomputation/controlplane/work_item.proto";

option java_package = "org.wfanet.measurement.internal.securecomputation.controlplane";
option java_multiple_files = true;
option java_outer_classname = "WorkItemsServiceProto";

// Internal service for persistence of `WorkItem` entities.
service WorkItems {
  rpc CreateWorkItem(CreateWorkItemRequest) returns (WorkItem);

  // Atomically creates a durable queued WorkItem, or returns a matching one.
  rpc EnsureWorkItem(EnsureWorkItemRequest) returns (WorkItem);

  rpc GetWorkItem(GetWorkItemRequest) returns (WorkItem);

  // Response ordered by `create_time`, ascending.
  rpc ListWorkItems(ListWorkItemsRequest) returns (ListWorkItemsResponse);

  rpc FailWorkItem(FailWorkItemRequest) returns (WorkItem);

  // Processes a delivery from a WorkItem dead-letter queue.
  //
  // An active unleased or expired attempt and its WorkItem are failed
  // terminally. An active attempt with a current lease is rejected so the
  // delivery can be retried after the worker completes or the lease expires.
  // Otherwise, the WorkItem is failed terminally.
  // (-- api-linter: core::0136::response-message-name=disabled
  //     aip.dev/not-precedent: This internal recovery RPC returns the affected
  //     resource so the DLQ listener can distinguish retry from terminal
  //     failure. --)
  rpc ProcessWorkItemDeadLetter(ProcessWorkItemDeadLetterRequest)
      returns (WorkItem);

  // Retries a FAILED WorkItem or a RUNNING WorkItem with no active attempt, or
  // republishes a QUEUED WorkItem. If the previous QUEUED publication was
  // acknowledged, the retry advances the WorkItem generation.
  //
  // An abandoned active attempt must be failed separately before retrying its
  // WorkItem.
  rpc RetryWorkItem(RetryWorkItemRequest) returns (WorkItem);
}

message CreateWorkItemRequest {
  WorkItem work_item = 1;
}

message EnsureWorkItemRequest {
  WorkItem work_item = 1;
}

message GetWorkItemRequest {
  string work_item_resource_id = 1;
}

message ListWorkItemsRequest {
  // The maximum number of results to return.
  //
  // If unspecified, at most 50 results will be returned. The maximum value is
  // 100; values above this will be coerced to the maximum value.
  int32 page_size = 1;
  ListWorkItemsPageToken page_token = 2;
}

message ListWorkItemsResponse {
  repeated WorkItem work_items = 1;

  // Token for requesting subsequent pages.
  //
  // If not specified, there are no more results.
  ListWorkItemsPageToken next_page_token = 2;
}

message ListWorkItemsPageToken {
  message After {
    google.protobuf.Timestamp created_after = 1;
    string work_item_resource_id = 2;
  }
  After after = 1;
}

message FailWorkItemRequest {
  string work_item_resource_id = 1;

  // Expected execution generation from the queue message. New callers must
  // populate this field. Absence is interpreted as generation 1 only for
  // legacy-client compatibility; an explicit value less than 1 is invalid.
  optional int64 expected_work_item_generation = 2
      [(google.api.field_behavior) = OPTIONAL];
}

message ProcessWorkItemDeadLetterRequest {
  string work_item_resource_id = 1;

  // Expected execution generation from the dead-letter delivery. New callers
  // must populate this field. Absence is interpreted as generation 1 only for
  // legacy-client compatibility; an explicit value less than 1 is invalid.
  optional int64 expected_work_item_generation = 2
      [(google.api.field_behavior) = OPTIONAL];
}

message RetryWorkItemRequest {
  string work_item_resource_id = 1;

  // Expected execution generation. New callers must populate this field.
  // Absence is interpreted as generation 1 only for legacy-client
  // compatibility; an explicit value less than 1 is invalid.
  optional int64 expected_work_item_generation = 2
      [(google.api.field_behavior) = OPTIONAL];
}
