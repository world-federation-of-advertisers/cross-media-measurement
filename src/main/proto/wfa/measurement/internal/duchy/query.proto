syntax = "proto3";

package wfa.measurement.internal.duchy;

option java_package = "org.wfanet.measurement.internal.duchy";
option java_multiple_files = true;

// The internal Duchy copy of
// [wfa.measurement.system.v1alpha.PopulationAttributeValue][]: the value of a
// field whose [EventFieldDescriptor.population_attribute][] is true.
message PopulationAttributeValue {
  // Value type selector.
  oneof selector {
    // Value as a string.
    string string_value = 1;
    // Value as the symbol of an enum value, e.g. "VIDEO" rather than "1".
    string enum_value = 2;
    // Value as a Boolean.
    bool bool_value = 3;
    // Value as a float.
    float float_value = 4;
  }
}

// The internal Duchy copy of [wfa.measurement.system.v1alpha.VectorSet][].
message VectorSet {
  // Values of [RequisitionDetails.vector_index][], distinct. The mill
  // addresses base vectors by this index.
  repeated int32 base_vectors = 1;
}

// The internal Duchy copy of [wfa.measurement.system.v1alpha.VidFilter][].
message VidFilter {
  // A Venn region, as who reached the VID and who did not.
  message ReachClause {
    // The VID's count is greater than zero in each of these sets.
    repeated VectorSet reached_sets = 1;
    // The VID's count is zero in this set.
    VectorSet unreached_set = 2;
  }
  // A VID passes when it satisfies any clause.
  repeated ReachClause reach_clauses = 1;

  // The VID falls in a subpopulation matching every entry, keyed by the field
  // path.
  map<string, PopulationAttributeValue> attributes = 2;
}

// The internal Duchy copy of [wfa.measurement.system.v1alpha.Query][].
message Query {
  // Identifier echoed on every result of this query.
  string id = 1;

  // FROM. Whose counts to add for a VID that passes [vid_filter][].
  VectorSet summands = 2;

  // WHERE. Covers the whole population when unset.
  VidFilter vid_filter = 3;

  // GROUP BY. One result per combination of the values these fields take
  // across [PopulationSpec.subpopulations][], resolved per VID from the
  // subpopulation it falls in. Each entry is the path of a
  // population attribute field.
  repeated string grouping_paths = 4;

  // Counts above this fold into the top bin of the frequency histogram.
  //
  // Every cell reports reach, frequency and impressions; they read off one
  // histogram, so producing all three costs no more than producing one.
  int32 max_frequency = 5;
}
