syntax = "proto3";

package wfa.measurement.internal.duchy.protocol;

import "wfa/measurement/internal/duchy/config/protocols_setup_config.proto";
import "wfa/measurement/internal/duchy/population_spec.proto";
import "google/protobuf/descriptor.proto";
import "wfa/measurement/internal/duchy/query.proto";

option java_package = "org.wfanet.measurement.internal.duchy.protocol";
option java_multiple_files = true;

// The TrusTEE multimeasurement protocol. A computation holds several labeled
// base vectors and evaluates a set of queries over them, returning one result
// per query per grouping combination.
message TrusTeeV2 {
  // Stages of the TrusTEE multimeasurement computation.
  //
  // The stage transitions are:
  // INITIALIZED -> WAIT_TO_START -> COMPUTING -> COMPLETE
  enum Stage {
    // The computation stage is unknown. This is never set intentionally.
    STAGE_UNSPECIFIED = 0;

    // The computation is created by the Duchy Herald.
    INITIALIZED = 1;

    // The Duchy calls setRequisitionParams at the Kingdom. The computation is
    // waiting for requisitions.
    WAIT_TO_START = 2;

    // Requisitions have all been fulfilled. The Duchy is running the TEE
    // computation by TEE mill.
    COMPUTING = 3;

    // Computation is either successful or failed.
    COMPLETE = 4;
  }

  message ComputationDetails {
    // For the TrusTEE multimeasurement protocol, the role is AGGREGATOR.
    wfa.measurement.internal.duchy.config.RoleInComputation role = 1;

    // Copied from the System API `Computation`. Only the mill reads these.
    repeated wfa.measurement.internal.duchy.Query queries = 2;

    // Copied likewise. What attribute filters and groupings resolve against.
    wfa.measurement.internal.duchy.PopulationSpec population_spec = 3;

    // Copied likewise. Schema for reading a named field out of a
    // [PopulationSpec.SubPopulation.attributes][] entry, which is a packed
    // event template message.
    EventDescriptor event_descriptor = 4;
  }

  // The event message type that a computation's `PopulationSpec` subpopulation
  // attributes are written against.
  message EventDescriptor {
    // `FileDescriptorSet` including the `FileDescriptorProto` of the event
    // message type and the transitive closure of its dependencies.
    google.protobuf.FileDescriptorSet descriptor_set = 1;

    // Full name of the event message type within `descriptor_set`.
    string event_message_type = 2;
  }

  // Every stage reads the computation's own details.
  message StageDetails {}
}
