syntax = "proto3";

package wfa.measurement.internal.edpaggregator;

option java_package = "org.wfanet.measurement.internal.edpaggregator";
option java_multiple_files = true;
option java_outer_classname = "DataAvailabilitySyncLeaseStateProto";

enum DataAvailabilitySyncLeaseState {
  // The lease state is unknown.
  DATA_AVAILABILITY_SYNC_LEASE_STATE_UNSPECIFIED = 0;

  // The synchronization attempt owns an unexpired lease.
  DATA_AVAILABILITY_SYNC_LEASE_STATE_ACTIVE = 1;

  // The synchronization attempt released its lease.
  DATA_AVAILABILITY_SYNC_LEASE_STATE_RELEASED = 2;

  // The synchronization attempt did not renew its lease before expiration.
  DATA_AVAILABILITY_SYNC_LEASE_STATE_EXPIRED = 3;
}
