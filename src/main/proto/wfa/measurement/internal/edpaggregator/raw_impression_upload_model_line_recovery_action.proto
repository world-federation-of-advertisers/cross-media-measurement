syntax = "proto3";

package wfa.measurement.internal.edpaggregator;

option java_package = "org.wfanet.measurement.internal.edpaggregator";
option java_multiple_files = true;
option java_outer_classname = "RawImpressionUploadModelLineRecoveryActionProto";

// Action required to replace output invalidated by an eviction.
enum RawImpressionUploadModelLineRecoveryAction {
  // No recovery action is specified.
  RAW_IMPRESSION_UPLOAD_MODEL_LINE_RECOVERY_ACTION_UNSPECIFIED = 0;
  // The EDP must correct the raw input and create a replacement upload.
  RAW_IMPRESSION_UPLOAD_MODEL_LINE_RECOVERY_ACTION_EDP_CORRECTION = 1;
  // Operator recovery of an evicted upload for the memoized path only.
  RAW_IMPRESSION_UPLOAD_MODEL_LINE_RECOVERY_ACTION_OPERATOR_RECOVERY = 2;
}
