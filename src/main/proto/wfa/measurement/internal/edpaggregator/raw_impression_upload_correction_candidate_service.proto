syntax = "proto3";

package wfa.measurement.internal.edpaggregator;

import "google/protobuf/timestamp.proto";
import "wfa/measurement/internal/edpaggregator/raw_impression_upload.proto";
import "wfa/measurement/internal/edpaggregator/raw_impression_upload_correction_candidate.proto";

option java_package = "org.wfanet.measurement.internal.edpaggregator";
option java_multiple_files = true;
option java_outer_classname = "RawImpressionUploadCorrectionCandidateServiceProto";

service RawImpressionUploadCorrectionCandidateService {
  rpc CreateQuarantinedRawImpressionUpload(
      CreateQuarantinedRawImpressionUploadRequest)
      returns (RawImpressionUpload);
  rpc ActivateQuarantinedRawImpressionUpload(
      ActivateQuarantinedRawImpressionUploadRequest)
      returns (RawImpressionUpload);
  rpc RegisterDetectedRawImpressionUploadCorrectionCandidate(
      RegisterDetectedRawImpressionUploadCorrectionCandidateRequest)
      returns (RegisterDetectedRawImpressionUploadCorrectionCandidateResponse);
  rpc ResolveDetectedRawImpressionUploadCorrectionCandidate(
      ResolveDetectedRawImpressionUploadCorrectionCandidateRequest)
      returns (ResolveDetectedRawImpressionUploadCorrectionCandidateResponse);
  rpc CreateRawImpressionUploadCorrectionCandidate(
      CreateRawImpressionUploadCorrectionCandidateRequest)
      returns (RawImpressionUploadCorrectionCandidate);
  rpc GetRawImpressionUploadCorrectionCandidate(
      GetRawImpressionUploadCorrectionCandidateRequest)
      returns (RawImpressionUploadCorrectionCandidate);
  rpc ListRawImpressionUploadCorrectionCandidates(
      ListRawImpressionUploadCorrectionCandidatesRequest)
      returns (ListRawImpressionUploadCorrectionCandidatesResponse);
  rpc AdvanceRawImpressionUploadCorrectionCandidate(
      AdvanceRawImpressionUploadCorrectionCandidateRequest)
      returns (RawImpressionUploadCorrectionCandidate);
  rpc PurgeExpiredRawImpressionUploadCorrectionCandidates(
      PurgeExpiredRawImpressionUploadCorrectionCandidatesRequest)
      returns (PurgeExpiredRawImpressionUploadCorrectionCandidatesResponse);
}

message CreateQuarantinedRawImpressionUploadRequest {
  string data_provider_resource_id = 1;
  RawImpressionUpload raw_impression_upload = 2;
  string raw_impression_upload_correction_candidate_id = 3;
  string request_id = 4;
}

message ActivateQuarantinedRawImpressionUploadRequest {
  string data_provider_resource_id = 1;
  string raw_impression_upload_resource_id = 2;
  string source_raw_impression_upload_resource_id = 3;
  string eviction_operation_id = 4;
  string request_id = 5;
}

message RegisterDetectedRawImpressionUploadCorrectionCandidateRequest {
  string data_provider_resource_id = 1;
  string raw_impression_upload_correction_candidate_id = 2;
  RawImpressionUploadCorrectionCandidate
      raw_impression_upload_correction_candidate = 3;
  string superseded_raw_impression_upload_correction_candidate_id = 4;
  string request_id = 5;
}

message RegisterDetectedRawImpressionUploadCorrectionCandidateResponse {
  RawImpressionUploadCorrectionCandidate
      raw_impression_upload_correction_candidate = 1;
  bool newly_created = 2;
}

message ResolveDetectedRawImpressionUploadCorrectionCandidateRequest {
  string data_provider_resource_id = 1;
  string raw_impression_upload_correction_candidate_id = 2;
  string request_id = 3;
}

message ResolveDetectedRawImpressionUploadCorrectionCandidateResponse {
  bool newly_resolved = 1;
}

message CreateRawImpressionUploadCorrectionCandidateRequest {
  string data_provider_resource_id = 1;
  string raw_impression_upload_correction_candidate_id = 2;
  RawImpressionUploadCorrectionCandidate
      raw_impression_upload_correction_candidate = 3;
  string request_id = 4;
}

message GetRawImpressionUploadCorrectionCandidateRequest {
  string data_provider_resource_id = 1;
  string raw_impression_upload_correction_candidate_id = 2;
}

message ListRawImpressionUploadCorrectionCandidatesRequest {
  string data_provider_resource_id = 1;
  int32 page_size = 2;
  ListRawImpressionUploadCorrectionCandidatesPageToken page_token = 3;

  message Filter {
    repeated RawImpressionUploadCorrectionCandidate.State state_in = 1;
    repeated RawImpressionUploadCorrectionCandidate.Classification
        classification_in = 2;
  }
  Filter filter = 4;
}

message ListRawImpressionUploadCorrectionCandidatesResponse {
  repeated RawImpressionUploadCorrectionCandidate
      raw_impression_upload_correction_candidates = 1;
  ListRawImpressionUploadCorrectionCandidatesPageToken next_page_token = 2;
}

message ListRawImpressionUploadCorrectionCandidatesPageToken {
  message After {
    google.protobuf.Timestamp create_time = 1;
    string raw_impression_upload_correction_candidate_id = 2;
  }
  After after = 1;
}

message AdvanceRawImpressionUploadCorrectionCandidateRequest {
  enum Action {
    reserved 2, 3;
    reserved "APPROVE_CORRECT", "APPROVE_NO_REPLACEMENT";

    ACTION_UNSPECIFIED = 0;
    ASSIGN_PLAN = 1;
    START_HEALING = 4;
    COMPLETE = 5;
    REJECT = 6;
    SUPERSEDE = 7;
    REQUIRE_MANUAL_INTERVENTION = 8;
  }

  string data_provider_resource_id = 1;
  string raw_impression_upload_correction_candidate_id = 2;
  string etag = 3;
  Action action = 4;
  string upload_healing_operation_id = 5;
  string superseding_raw_impression_upload_correction_candidate_id = 6;
  string request_id = 7;
}

message PurgeExpiredRawImpressionUploadCorrectionCandidatesRequest {
  string data_provider_resource_id = 1;
  int32 page_size = 2;
}

message PurgeExpiredRawImpressionUploadCorrectionCandidatesResponse {
  int32 purged_count = 1;
}
