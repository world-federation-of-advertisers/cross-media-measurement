syntax = "proto3";

package wfa.measurement.internal.edpaggregator;

option java_package = "org.wfanet.measurement.internal.edpaggregator";
option java_multiple_files = true;
option java_outer_classname = "RawImpressionUploadModelLineFailureReasonProto";

// Reason that a RawImpressionUploadModelLine entered the FAILED state.
enum RawImpressionUploadModelLineFailureReason {
  // The failure reason is unspecified.
  RAW_IMPRESSION_UPLOAD_MODEL_LINE_FAILURE_REASON_UNSPECIFIED = 0;
  // Pipeline processing failed and may be retried after its cause is fixed.
  RAW_IMPRESSION_UPLOAD_MODEL_LINE_FAILURE_REASON_PROCESSING_FAILURE = 1;
  // Output was invalidated by an operator and must be replaced, not retried.
  RAW_IMPRESSION_UPLOAD_MODEL_LINE_FAILURE_REASON_EVICTED_OUTPUT = 2;
}
