syntax = "proto3";

package wfa.measurement.internal.edpaggregator;

import "google/protobuf/timestamp.proto";
import "wfa/measurement/internal/edpaggregator/correction_candidate.proto";

option java_package = "org.wfanet.measurement.internal.edpaggregator";
option java_multiple_files = true;
option java_outer_classname = "CorrectionCandidateServiceProto";

service CorrectionCandidateService {
  rpc CreateCorrectionCandidate(CreateCorrectionCandidateRequest)
      returns (CorrectionCandidate);
  rpc GetCorrectionCandidate(GetCorrectionCandidateRequest)
      returns (CorrectionCandidate);
  rpc ListCorrectionCandidates(ListCorrectionCandidatesRequest)
      returns (ListCorrectionCandidatesResponse);
  rpc AdvanceCorrectionCandidate(AdvanceCorrectionCandidateRequest)
      returns (CorrectionCandidate);
}

message CreateCorrectionCandidateRequest {
  string data_provider_resource_id = 1;
  string correction_candidate_id = 2;
  CorrectionCandidate correction_candidate = 3;
  string request_id = 4;
}

message GetCorrectionCandidateRequest {
  string data_provider_resource_id = 1;
  string correction_candidate_id = 2;
}

message ListCorrectionCandidatesRequest {
  string data_provider_resource_id = 1;
  int32 page_size = 2;
  ListCorrectionCandidatesPageToken page_token = 3;

  message Filter {
    repeated CorrectionCandidate.State state_in = 1;
  }
  Filter filter = 4;
}

message ListCorrectionCandidatesResponse {
  repeated CorrectionCandidate correction_candidates = 1;
  ListCorrectionCandidatesPageToken next_page_token = 2;
}

message ListCorrectionCandidatesPageToken {
  message After {
    google.protobuf.Timestamp create_time = 1;
    string correction_candidate_id = 2;
  }
  After after = 1;
}

message AdvanceCorrectionCandidateRequest {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ASSIGN_PLAN = 1;
    APPROVE_CORRECT = 2;
    APPROVE_NO_REPLACEMENT = 3;
    START_HEALING = 4;
    COMPLETE = 5;
    REJECT = 6;
    SUPERSEDE = 7;
    REQUIRE_MANUAL_INTERVENTION = 8;
  }

  string data_provider_resource_id = 1;
  string correction_candidate_id = 2;
  string etag = 3;
  Action action = 4;
  string upload_healing_operation_id = 5;
  string superseding_correction_candidate_id = 6;
  string request_id = 7;
}
