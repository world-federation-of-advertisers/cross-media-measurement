syntax = "proto3";

package wfa.measurement.internal.edpaggregator;

import "google/protobuf/timestamp.proto";
import "google/type/date.proto";

option java_package = "org.wfanet.measurement.internal.edpaggregator";
option java_multiple_files = true;
option java_outer_classname = "RawImpressionUploadCorrectionCandidateProto";

// A quarantined non-additive raw-upload revision.
message RawImpressionUploadCorrectionCandidate {
  message ManifestEntry {
    string blob_uri = 1;
    int64 blob_generation = 2;
    google.type.Date event_date = 3;
    string owner_raw_impression_upload_resource_id = 4;
  }

  message ManifestDifference {
    enum Type {
      TYPE_UNSPECIFIED = 0;
      TYPE_ADDED = 1;
      TYPE_EDITED = 2;
      TYPE_REMOVED = 3;
    }

    Type type = 1;
    ManifestEntry prior = 2;
    ManifestEntry current = 3;
  }

  message ManifestComparison {
    repeated ManifestEntry prior_manifest = 1;
    repeated ManifestEntry current_manifest = 2;
    repeated ManifestDifference differences = 3;
  }

  enum Classification {
    CLASSIFICATION_UNSPECIFIED = 0;
    CLASSIFICATION_EDITED = 1;
    CLASSIFICATION_REMOVED = 2;
    CLASSIFICATION_MIXED = 3;
  }

  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_PENDING = 1;
    STATE_PLANNED = 2;
    STATE_APPROVED = 3;
    STATE_HEALING = 4;
    STATE_COMPLETE = 5;
    STATE_NO_REPLACEMENT = 6;
    STATE_REJECTED = 7;
    STATE_SUPERSEDED = 8;
    STATE_MANUAL_INTERVENTION_REQUIRED = 9;
  }

  enum Decision {
    DECISION_UNSPECIFIED = 0;
    DECISION_CORRECT = 1;
    DECISION_NO_REPLACEMENT = 2;
  }

  string data_provider_resource_id = 1;
  string raw_impression_upload_correction_candidate_id = 2;
  string raw_impression_upload_resource_id = 3;
  Classification classification = 4;
  bytes prior_manifest_digest = 5;
  bytes current_manifest_digest = 6;
  State state = 7;
  Decision decision = 8;
  string superseding_raw_impression_upload_correction_candidate_id = 9;
  string upload_healing_operation_id = 10;
  google.protobuf.Timestamp expire_time = 11;
  google.protobuf.Timestamp create_time = 12;
  google.protobuf.Timestamp update_time = 13;
  string etag = 14;
  ManifestComparison manifest_comparison = 15;
}
