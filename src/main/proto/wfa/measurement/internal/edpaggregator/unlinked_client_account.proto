syntax = "proto3";

package wfa.measurement.internal.edpaggregator;

import "google/protobuf/timestamp.proto";

option java_package = "org.wfanet.measurement.internal.edpaggregator";
option java_multiple_files = true;

// Proto representation of the internal UnlinkedClientAccount entity type.
//
// An UnlinkedClientAccount is an advertiser client-account reference ID that
// EventGroupSync could not resolve to any MeasurementConsumer.
message UnlinkedClientAccount {
  // The resource ID of the DataProvider that observed this unlinked account.
  //
  // Ignored on the `ReplaceUnlinkedClientAccounts` write path: the
  // request-level `data_provider_resource_id` is authoritative.
  string data_provider_resource_id = 1;

  // The reference ID of the client account in the DataProvider's ecosystem.
  string client_account_reference_id = 2;

  // The distinct brands observed for this client account. Display hint only.
  repeated string brands = 3;

  // One example EventGroup reference ID for this client account, for
  // traceability. Optional.
  string event_group_reference_id = 4;

  // The time this client account was first observed unlinked.
  google.protobuf.Timestamp first_observed_time = 5;
}
