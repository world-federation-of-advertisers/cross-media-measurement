syntax = "proto3";

package wfa.measurement.internal.edpaggregator;

import "wfa/measurement/internal/edpaggregator/unlinked_client_account.proto";

option java_package = "org.wfanet.measurement.internal.edpaggregator";
option java_multiple_files = true;

service UnlinkedClientAccountsService {
  // Replaces the full set of UnlinkedClientAccounts for a single DataProvider.
  //
  // This reconciles the stored set against the incoming set in a single
  // transaction:
  // * Newly-unlinked accounts are inserted, stamping `first_observed_time`.
  // * Still-unlinked accounts are kept, preserving their existing
  //   `first_observed_time`.
  // * Accounts absent from the incoming set are deleted (they have been
  //   linked).
  //
  // This is a full-set reconcile and is therefore idempotent: re-issuing the
  // same request yields the same stored state.
  rpc ReplaceUnlinkedClientAccounts(ReplaceUnlinkedClientAccountsRequest)
      returns (ReplaceUnlinkedClientAccountsResponse);

  // Lists the UnlinkedClientAccounts for a single DataProvider.
  rpc ListUnlinkedClientAccounts(ListUnlinkedClientAccountsRequest)
      returns (ListUnlinkedClientAccountsResponse);
}

message ReplaceUnlinkedClientAccountsRequest {
  string data_provider_resource_id = 1;

  // The full current set of unlinked client accounts for the DataProvider.
  //
  // An empty set deletes all stored accounts for this DataProvider.
  repeated UnlinkedClientAccount unlinked_client_accounts = 2;
}

message ReplaceUnlinkedClientAccountsResponse {
  // The reconciled set of unlinked client accounts, with `first_observed_time`
  // populated.
  repeated UnlinkedClientAccount unlinked_client_accounts = 1;
}

message ListUnlinkedClientAccountsRequest {
  string data_provider_resource_id = 1;

  // The maximum number of results to return.
  //
  // If unspecified, at most 50 results will be returned. The maximum value is
  // 1000; values above this will be coerced to the maximum value.
  int32 page_size = 2;
  ListUnlinkedClientAccountsPageToken page_token = 3;
}

message ListUnlinkedClientAccountsResponse {
  repeated UnlinkedClientAccount unlinked_client_accounts = 1;
  ListUnlinkedClientAccountsPageToken next_page_token = 2;
}

message ListUnlinkedClientAccountsPageToken {
  message After {
    string client_account_reference_id = 1;
  }
  After after = 1;
}
