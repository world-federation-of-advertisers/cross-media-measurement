syntax = "proto3";

package wfa.measurement.internal.edpaggregator;

import "google/protobuf/timestamp.proto";
import "google/type/date.proto";
import "wfa/measurement/internal/edpaggregator/data_availability_sync_task_failure_category.proto";
import "wfa/measurement/internal/edpaggregator/data_availability_sync_task_state.proto";

option java_package = "org.wfanet.measurement.internal.edpaggregator";
option java_multiple_files = true;
option java_outer_classname = "DataAvailabilitySyncTaskProto";

// Internal representation of a durable availability synchronization task.
message DataAvailabilitySyncTask {
  string data_provider_resource_id = 1;
  string raw_impression_upload_resource_id = 2;
  string data_availability_sync_task_resource_id = 3;
  DataAvailabilitySyncTaskState state = 4;
  string done_blob_uri = 5;
  int64 done_blob_generation = 6;
  string cmms_model_line = 7;
  google.type.Date event_date = 8;
  string traceparent = 9;
  string tracestate = 10;
  int32 attempt_count = 11;
  DataAvailabilitySyncTaskFailureCategory failure_category = 12;
  google.protobuf.Timestamp create_time = 13;
  google.protobuf.Timestamp update_time = 14;
  string etag = 15;
  string done_blob_path_hash = 16;
}
