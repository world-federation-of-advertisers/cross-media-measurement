syntax = "proto3";

package wfa.measurement.internal.edpaggregator;

import "wfa/measurement/internal/edpaggregator/upload_healing_operation.proto";

option java_package = "org.wfanet.measurement.internal.edpaggregator";
option java_multiple_files = true;
option java_outer_classname = "UploadHealingOperationServiceProto";

service UploadHealingOperationService {
  rpc CreateUploadHealingOperation(CreateUploadHealingOperationRequest)
      returns (UploadHealingOperation);
  rpc GetUploadHealingOperation(GetUploadHealingOperationRequest)
      returns (UploadHealingOperation);
  rpc AdvanceUploadHealingStep(AdvanceUploadHealingStepRequest)
      returns (UploadHealingStep);
}

message CreateUploadHealingOperationRequest {
  string data_provider_resource_id = 1;
  string upload_healing_operation_id = 2;
  UploadHealingOperation upload_healing_operation = 3;
  string request_id = 4;
}

message GetUploadHealingOperationRequest {
  string data_provider_resource_id = 1;
  string upload_healing_operation_id = 2;
}

message AdvanceUploadHealingStepRequest {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    CONFIRM_EVICTION = 1;
    RECORD_RECOVERY = 2;
    CONFIRM_REPLACEMENT = 3;
  }

  string data_provider_resource_id = 1;
  string upload_healing_operation_id = 2;
  int64 upload_healing_step_id = 3;
  string etag = 4;
  Action action = 5;
  string replacement_raw_impression_upload_resource_id = 6;
  int64 recovery_done_blob_generation = 7;
  string request_id = 8;
}
