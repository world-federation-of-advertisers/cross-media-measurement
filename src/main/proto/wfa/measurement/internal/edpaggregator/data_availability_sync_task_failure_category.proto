syntax = "proto3";

package wfa.measurement.internal.edpaggregator;

option java_package = "org.wfanet.measurement.internal.edpaggregator";
option java_multiple_files = true;
option java_outer_classname = "DataAvailabilitySyncTaskFailureCategoryProto";

enum DataAvailabilitySyncTaskFailureCategory {
  DATA_AVAILABILITY_SYNC_TASK_FAILURE_CATEGORY_UNSPECIFIED = 0;
  DATA_AVAILABILITY_SYNC_TASK_FAILURE_CATEGORY_PUBLICATION = 1;
  DATA_AVAILABILITY_SYNC_TASK_FAILURE_CATEGORY_SYNCHRONIZATION = 2;
  DATA_AVAILABILITY_SYNC_TASK_FAILURE_CATEGORY_METADATA_PERSISTENCE = 3;
  DATA_AVAILABILITY_SYNC_TASK_FAILURE_CATEGORY_GAP_POLICY = 4;
  DATA_AVAILABILITY_SYNC_TASK_FAILURE_CATEGORY_KINGDOM_PUBLICATION = 5;
  DATA_AVAILABILITY_SYNC_TASK_FAILURE_CATEGORY_INTERNAL = 6;
}
