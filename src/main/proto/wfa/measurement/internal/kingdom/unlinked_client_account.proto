syntax = "proto3";

package wfa.measurement.internal.kingdom;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "wfa/measurement/internal/kingdom/event_group.proto";

option java_package = "org.wfanet.measurement.internal.kingdom";
option java_multiple_files = true;

// Proto representation of the internal UnlinkedClientAccount entity type.
//
// An UnlinkedClientAccount is an advertiser client-account reference ID that
// EventGroupSync could not resolve to any MeasurementConsumer.
message UnlinkedClientAccount {
  // External ID of the `DataProvider` that observed this unlinked account.
  fixed64 external_data_provider_id = 1;

  // Reference ID of the client account in the DataProvider ecosystem.
  //
  // Must be at most 36 characters.
  string client_account_reference_id = 2;

  // Free-form metadata observed for this client account. Display hint only.
  google.protobuf.Struct entity_metadata = 3;

  // One EventGroup observed for this client account, for traceability.
  // Optional.
  oneof observed_event_group {
    // Legacy EventGroup reference ID.
    string event_group_reference_id = 4;

    // Entity key of an observed EventGroup.
    EventGroup.EntityKey entity_key = 5;
  }

  // The time this client account was created. Output-only.
  google.protobuf.Timestamp create_time = 6;
}
