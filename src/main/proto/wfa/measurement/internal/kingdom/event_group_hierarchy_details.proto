syntax = "proto3";

package wfa.measurement.internal.kingdom;

option java_package = "org.wfanet.measurement.internal.kingdom";
option java_multiple_files = true;

message EventGroupHierarchyDetails {
  // A single level of an EventGroupHierarchy.
  message Level {
    // The EventGroup.EntityKey.entity_type of EventGroups at this level.
    //
    // Distinct from the entity_type of every other Level of every
    // EventGroupHierarchy of the same DataProvider. The value "campaign" is
    // reserved for legacy EventGroups and is never used here.
    string entity_type = 1;

    // The entity_metadata key holding the ID of the entity at this level.
    //
    // Its value forms one segment of EventGroups.EntityPath.
    string id_entity_metadata_key = 2;

    // The entity_metadata keys which describe the entity at this level.
    //
    // These are copied onto the EventGroup representing an entity at this
    // level. Keys which no Level claims are not interpreted.
    repeated string entity_metadata_keys = 3;
  }

  // The levels of this hierarchy, outermost first.
  //
  // A level may be added at the innermost end, which leaves every existing
  // EventGroups.EntityPath unchanged. Levels are never reordered, removed, or
  // added at the outermost end.
  repeated Level levels = 1;
}
