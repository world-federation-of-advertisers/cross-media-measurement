syntax = "proto3";

package wfa.measurement.internal.kingdom;

import "wfa/measurement/internal/kingdom/duchy_protocol_config.proto";
import "wfa/measurement/internal/kingdom/measurement_failure.proto";
import "wfa/measurement/internal/kingdom/protocol_config.proto";

option java_package = "org.wfanet.measurement.internal.kingdom";
option java_multiple_files = true;

message MeasurementDetails {
  // Version the public API for serialized message definitions.
  string api_version = 1;

  // Serialized `MeasurementSpec` from public API.
  bytes measurement_spec = 2;
  bytes measurement_spec_signature = 3;
  string measurement_spec_signature_algorithm_oid = 9;

  // The protocol config used in this measurement.
  ProtocolConfig protocol_config = 6;
  DuchyProtocolConfig duchy_protocol_config = 7;

  // Set when the state is set to FAILED.
  MeasurementFailure failure = 8;

  // Serialized `Query` messages from the public API
  // `Measurement.Multimeasurement.queries`. Set only for a multimeasurement.
  repeated bytes queries = 10;

  // A `Result` that is neither signed nor encrypted.
  message PlaintextResult {
    // External ID of the aggregator `Duchy` that set the result.
    string external_aggregator_duchy_id = 1;

    // Serialized `Result` message from the public API.
    bytes result = 2;

    // Version of the public API for `result`.
    string api_version = 3;
  }
  // Result of a TrusTEE v2 multimeasurement. Set only once the `Measurement`
  // has succeeded.
  //
  // This is surfaced as an item of `Measurement.results`.
  PlaintextResult plaintext_result = 11;
}
