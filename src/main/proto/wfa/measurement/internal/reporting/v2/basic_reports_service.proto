syntax = "proto3";

package wfa.measurement.internal.reporting.v2;

import "google/protobuf/timestamp.proto";
import "wfa/measurement/internal/reporting/v2/basic_report.proto";
import "wfa/measurement/internal/reporting/v2/report_computation.proto";

option java_package = "org.wfanet.measurement.internal.reporting.v2";
option java_multiple_files = true;

// Internal service for persistence of Basic Report entities.
service BasicReports {
  // Inserts a `BasicReport` into the database in the
  // `BasicReport.State.SUCCEEDED` state.
  //
  // The `BasicReport` must already be considered in the
  // `BasicReport.State.SUCCEEDED` state.
  //
  // Error reasons:
  // * `REPORTING_SET_NOT_FOUND`
  // * `IMPRESSION_QUALIFICATION_FILTER_NOT_FOUND`
  // * `BASIC_REPORT_ALREADY_EXISTS`
  rpc InsertBasicReport(InsertBasicReportRequest) returns (BasicReport);

  // Creates a `BasicReport` in the `BasicReport.State.CREATED` state, or
  // in the `BasicReport.State.CREATED_MULTIMEASUREMENT` state, with its
  // `ReportComputation`s, if `report_computations` is set.
  //
  // Error reasons:
  // * `REPORTING_SET_NOT_FOUND`
  // * `BASIC_REPORT_ALREADY_EXISTS`
  // * `IMPRESSION_QUALIFICATION_FILTER_NOT_FOUND`
  // * `INVALID_FIELD_VALUE`
  rpc CreateBasicReport(CreateBasicReportRequest) returns (BasicReport);

  // Sets the `BasicReport.external_report_id` field and transitions the
  // `BasicReport` to the `BasicReport.State.REPORT_CREATED` state.
  //
  // The `BasicReport` must be in the `BasicReport.State.CREATED` state.
  //
  // Error reasons:
  // * `REQUIRED_FIELD_NOT_SET`
  // * `BASIC_REPORT_NOT_FOUND`
  // * `BASIC_REPORT_STATE_INVALID`
  rpc SetExternalReportId(SetExternalReportIdRequest) returns (BasicReport);

  // Error reasons:
  // * `REQUIRED_FIELD_NOT_SET`
  // * `BASIC_REPORT_NOT_FOUND`
  rpc GetBasicReport(GetBasicReportRequest) returns (BasicReport);

  // Lists `BasicReport` entities.
  //
  // Ordered by `create_time` ascending, `external_basic_report_id` ascending,
  // `cmms_measurement_consumer_id` ascending.
  rpc ListBasicReports(ListBasicReportsRequest)
      returns (ListBasicReportsResponse);

  // Transitions the `BasicReport` to the `BasicReport.State.FAILED` state.
  //
  // The `BasicReport` must not already be in a terminal state.
  //
  // Error reasons:
  // * `REQUIRED_FIELD_NOT_SET`
  // * `BASIC_REPORT_NOT_FOUND`
  // * `BASIC_REPORT_STATE_INVALID`
  rpc FailBasicReport(FailBasicReportRequest) returns (BasicReport);

  // Lists every `ReportComputation` of a `BasicReport`.
  //
  // Error reasons:
  // * `REQUIRED_FIELD_NOT_SET`
  // * `BASIC_REPORT_NOT_FOUND`
  rpc ListReportComputations(ListReportComputationsRequest)
      returns (ListReportComputationsResponse);

  // Sets the `ReportComputation.cmms_measurement_id` field.
  //
  // If the field already has the requested value, returns the
  // `ReportComputation` unchanged. Otherwise the `BasicReport` must be in the
  // `BasicReport.State.CREATED_MULTIMEASUREMENT` state and the field must be
  // unset.
  //
  // Error reasons:
  // * `REQUIRED_FIELD_NOT_SET`
  // * `BASIC_REPORT_NOT_FOUND`
  // * `BASIC_REPORT_STATE_INVALID`
  // * `REPORT_COMPUTATION_NOT_FOUND`
  // * `REPORT_COMPUTATION_STATE_INVALID` if the field is already set to a
  //   different value
  rpc SetReportComputationMeasurementId(
      SetReportComputationMeasurementIdRequest) returns (ReportComputation);

  // Transitions the `BasicReport` to the
  // `BasicReport.State.MEASUREMENTS_CREATED` state.
  //
  // The `BasicReport` must be in the
  // `BasicReport.State.CREATED_MULTIMEASUREMENT` state, and have at least one
  // `ReportComputation`, every one of which has `cmms_measurement_id` set.
  //
  // Error reasons:
  // * `REQUIRED_FIELD_NOT_SET`
  // * `BASIC_REPORT_NOT_FOUND`
  // * `BASIC_REPORT_STATE_INVALID`
  // * `REPORT_COMPUTATION_STATE_INVALID` if one has no `cmms_measurement_id`
  rpc SetMeasurementsCreated(SetMeasurementsCreatedRequest)
      returns (BasicReport);
}

message InsertBasicReportRequest {
  BasicReport basic_report = 1;
}

message CreateBasicReportRequest {
  BasicReport basic_report = 1;
  string request_id = 2;
  // The `ReportComputation`s of a `BasicReport` on the multimeasurement path,
  // one per impression qualification filter, or empty for the legacy path.
  //
  // `cmms_measurement_consumer_id`, `external_basic_report_id`,
  // `cmms_create_measurement_request_id` and `cmms_measurement_id` are not
  // set.
  repeated ReportComputation report_computations = 3;
}

message SetExternalReportIdRequest {
  string cmms_measurement_consumer_id = 1;
  string external_basic_report_id = 2;
  string external_report_id = 3;
}

message GetBasicReportRequest {
  // Ex: If a `BasicReport` has the name
  // "measurementconsumers/abc/basicreports/abcd", then the
  // `MeasurementConsumer` ID is "abc" and the `BasicReport` ID is "abcd".
  string cmms_measurement_consumer_id = 1;
  string external_basic_report_id = 2;
}

// Page token for ListBasicReports method.
//
// This must be treated as opaque by API callers.
message ListBasicReportsPageToken {
  reserved 1, 2;

  message PreviousPageEnd {
    google.protobuf.Timestamp create_time = 1;
    string external_basic_report_id = 2;
    string cmms_measurement_consumer_id = 3;
  }
  PreviousPageEnd last_basic_report = 3;
}

message ListBasicReportsRequest {
  message Filter {
    // `MeasurementConsumer` ID from the CMMS public API. Required.
    string cmms_measurement_consumer_id = 1;

    // Any `BasicReport` created after this time, exclusive, will be included.
    google.protobuf.Timestamp create_time_after = 2;

    BasicReport.State state = 3;

    fixed64 external_report_result_id = 4;
  }
  Filter filter = 1;
  // The maximum number of basic reports to return. The service may return fewer
  // than this value. If unspecified, at most 10 basic reports will be returned.
  // The maximum value is 25; values above 25 will be coerced to 25.
  int32 page_size = 2;
  ListBasicReportsPageToken page_token = 3;
}

message ListBasicReportsResponse {
  repeated BasicReport basic_reports = 1;
  ListBasicReportsPageToken next_page_token = 2;

  // Resource names of `BasicReport`s that matched the filter criteria but
  // could not be returned in `basic_reports` because the service was unable
  // to render their results (for example, due to internal data inconsistency).
  //
  // See AIP-217.
  repeated string unreachable = 3;
}

message FailBasicReportRequest {
  string cmms_measurement_consumer_id = 1;
  string external_basic_report_id = 2;
}

message ListReportComputationsRequest {
  string cmms_measurement_consumer_id = 1;
  string external_basic_report_id = 2;
}

message ListReportComputationsResponse {
  repeated ReportComputation report_computations = 1;
}

message SetReportComputationMeasurementIdRequest {
  string cmms_measurement_consumer_id = 1;
  string external_basic_report_id = 2;
  // External ID of the impression qualification filter, or empty for the
  // custom filter.
  string external_impression_qualification_filter_id = 3;
  // ID of the `Measurement` from the CMMS public API. Required.
  string cmms_measurement_id = 4;
}

message SetMeasurementsCreatedRequest {
  string cmms_measurement_consumer_id = 1;
  string external_basic_report_id = 2;
}
