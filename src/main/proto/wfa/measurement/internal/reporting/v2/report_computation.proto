syntax = "proto3";

package wfa.measurement.internal.reporting.v2;

import "google/protobuf/empty.proto";
import "google/type/date.proto";

option java_package = "org.wfanet.measurement.internal.reporting.v2";
option java_multiple_files = true;

// One multimeasurement a `BasicReport` is computed by: one per impression
// qualification filter the `BasicReport` names.
message ReportComputation {
  // ID of the `MeasurementConsumer` from the CMMS public API.
  string cmms_measurement_consumer_id = 1;
  // External ID of the `BasicReport` this computation serves.
  string external_basic_report_id = 2;

  // Request ID of the `CreateMeasurement` call for this computation, set before
  // the call so a retry returns the existing `Measurement`.
  string cmms_create_measurement_request_id = 3;
  // ID of the `Measurement` from the CMMS public API. Empty until created.
  string cmms_measurement_id = 4;

  // ID of the impression qualification filter every base vector of this
  // computation qualifies under.
  int64 impression_qualification_filter_id = 5;

  // One per `Query` of this computation's multimeasurement.
  repeated ResultGroupQueryMapping mappings = 6;

  // Number of `CreateMeasurement` attempts, incremented before each one.
  int32 create_attempts = 7;
}

// Where the cells of one multimeasurement `Query` land in a `BasicReport`.
message ResultGroupQueryMapping {
  // ID of the `Query`, matching `QueryResult.query_id` in the result.
  string query_id = 1;
  // Index of the `ResultGroupSpec` the cells belong to.
  int32 result_group_spec_index = 2;

  // Start of the reporting window the cells cover.
  google.type.Date window_start = 3;
  // End of the reporting window the cells cover, inclusive.
  google.type.Date window_end = 4;
  // Whether the cells are cumulative over the reporting interval.
  bool cumulative = 5;

  // One component of the reporting unit.
  message Component {
    // External ID of the component's `ReportingSet`.
    string component = 1;
  }
  // The components whose intersection the cells cover.
  message Intersection {
    // External IDs of the components' `ReportingSet`s.
    repeated string components = 1;
  }
  // The `ResultGroup` slot the cells fill. Required.
  oneof slot {
    // The reporting unit as a whole.
    google.protobuf.Empty reporting_unit = 6;
    // One component.
    Component component = 7;
    // One component's unique reach.
    Component component_unique = 8;
    // An intersection of components.
    Intersection intersection = 9;
  }
}
