name: Seed High Overlap Dataset

run-name: Seed High Overlap Dataset [${{ inputs.environment }}]

# Serialize preparation with Update CMMS so it cannot replace data during those tests.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub-managed environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - head
      force-refresh:
        description: "Reseed even when the existing dataset matches"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: update-cmms-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  seed:
    uses: ./.github/workflows/prepare-high-overlap-dataset.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ inputs.environment }}
      only-if-needed: ${{ !inputs.force-refresh }}
