name: Seed High Overlap Dataset

run-name: Seed High Overlap Dataset [${{ inputs.environment || 'dev' }}]

# Run when the high overlap dataset's specs change or an environment gains an EDP. The reporting
# integration test refuses to run against a dataset that no longer matches its specs.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub-managed environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - head
  # DO_NOT_SUBMIT(world-federation-of-advertisers/cross-media-measurement#4661): Remove this
  # trigger, which seeds dev on every push for testing.
  push:
    branches:
      - uakyol-qa-bigquery

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    environment: ${{ inputs.environment || 'dev' }}
    env:
      ENVIRONMENT: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Bazel
        uses: world-federation-of-advertisers/actions/setup-bazel@390a9ea948eef416333f8c257ef6116552a42d23 # v2.6.0

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.TF_SERVICE_ACCOUNT }}

      - name: Write auth.bazelrc
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          cat << EOF > auth.bazelrc
          build --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY
          EOF

      - name: Write ~/.bazelrc
        run: |
          cat << EOF > ~/.bazelrc
          common --config=ci
          EOF

      # Reduce chance of disconnection from the Build Event Service.
      - name: Set TCP keepalive
        run: sudo sysctl -w net.ipv4.tcp_keepalive_time=60

      # The edpa_meta AWS KMS client authenticates via web-identity federation using a Google
      # (accounts.google.com) OIDC token. The AWS role EDPA_META_AWS_ROLE_ARN trusts the CI service
      # account's numeric subject (accounts.google.com:sub) and has no audience condition. Mint the
      # token right before seeding for maximum validity headroom.
      - name: Mint Google web-identity token for AWS
        id: aws_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.TF_SERVICE_ACCOUNT }}
          token_format: 'id_token'
          id_token_audience: ${{ vars.EDPA_META_AWS_AUDIENCE }}
          create_credentials_file: false
          export_environment_variables: false

      - name: Write AWS web-identity token file
        env:
          AWS_WEB_IDENTITY_ID_TOKEN: ${{ steps.aws_auth.outputs.id_token }}
        run: |
          token_file="$RUNNER_TEMP/aws-web-identity-token"
          printf '%s' "$AWS_WEB_IDENTITY_ID_TOKEN" > "$token_file"
          chmod 600 "$token_file"
          echo "AWS_WEB_IDENTITY_TOKEN_FILE=$token_file" >> "$GITHUB_ENV"

      - name: Seed the dataset
        env:
          KINGDOM_PUBLIC_API_TARGET: ${{ vars.KINGDOM_PUBLIC_API_TARGET }}
          MC_NAME: ${{ vars.MC_NAME }}
          PDP_NAME: ${{ vars.PDP_NAME }}
          HIGH_OVERLAP_MODEL_LINE: ${{ vars.HIGH_OVERLAP_MODEL_LINE }}
          EDPA_META_KEK_URI: ${{ vars.EDPA_META_KEK_URI }}
          EDPA_META_AWS_ROLE_ARN: ${{ vars.EDPA_META_AWS_ROLE_ARN }}
          EDPA_META_AWS_REGION: ${{ vars.EDPA_META_AWS_REGION }}
        run: |
          set -euo pipefail
          config_dir="src/main/terraform/gcloud/cmms/envs/$ENVIRONMENT"
          tfvar() { grep -E "^$1 " "$config_dir.tfvars" | head -1 | cut -d'"' -f2; }
          edp7_id="$(jq -er '.edps[] | select(.name == "edp7") | .resource_id' "$config_dir/dashboard-config.json")"
          # edp7's KEK is shared by every EDP that encrypts with Google Cloud KMS.
          edp7_kek_uri="$(awk -v dp="dataProviders/$edp7_id" \
            'index($0, "data_provider: \"" dp "\"") {found = 1}
             found && /kek_uri:/ {split($0, parts, "\""); print parts[2]; exit}' \
            "$config_dir/event-data-provider-configs.textproto")"
          secret_files="$GITHUB_WORKSPACE/src/main/k8s/testing/secretfiles"

          bazel run //src/main/kotlin/org/wfanet/measurement/loadtest/edpaggregator/tools:SeedHighOverlapDataset -- \
            --kingdom-public-api-target="$KINGDOM_PUBLIC_API_TARGET" \
            --kingdom-public-api-cert-host=localhost \
            --kingdom-trusted-certs-file="$secret_files/kingdom_root.pem" \
            --pdp-tls-cert-file="$secret_files/pdp1_tls.pem" \
            --pdp-tls-key-file="$secret_files/pdp1_tls.key" \
            --model-provider-tls-cert-file="$secret_files/mp1_tls.pem" \
            --model-provider-tls-key-file="$secret_files/mp1_tls.key" \
            --population-data-provider="$PDP_NAME" \
            --model-line="$HIGH_OVERLAP_MODEL_LINE" \
            --measurement-consumer="$MC_NAME" \
            --storage-bucket="$(tfvar secure_computation_storage_bucket_name)" \
            --google-project-id="$GOOGLE_CLOUD_PROJECT" \
            --google-cloud-kms-kek-uri="$edp7_kek_uri" \
            --aws-kms-kek-uri="$EDPA_META_KEK_URI" \
            --aws-role-arn="$EDPA_META_AWS_ROLE_ARN" \
            --aws-region="$EDPA_META_AWS_REGION" \
            --aws-web-identity-token-file="$AWS_WEB_IDENTITY_TOKEN_FILE"
