name: EDP KMS Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/edp-kms-terraform.yml'
      - 'src/main/terraform/gcloud/modules/confidential-space-workload-identity/**'
      - 'src/main/terraform/gcloud/modules/edp-aggregator-edp-deployment/**'
      - 'src/main/terraform/gcloud/examples/edp-kms/**'
      - 'src/main/terraform/aws/modules/edp-kms/**'
      - 'src/main/terraform/aws/examples/edp-kms/**'
      - 'src/main/terraform/aws/examples/edp-kms-google-bridge/**'
      - 'src/test/terraform/**'
      - 'src/main/terraform/gcloud/edp-kms/**'
      - 'src/main/terraform/gcloud/modules/edp-kms-attestation-policy/**'
      - 'src/main/terraform/aws/edp-kms/**'
      - '.github/env-configs/edp-kms.json'
      - '.github/env-configs/*/cmms.json'
      - 'cosign-*-pub-key.pem'
      - 'src/main/terraform/gcloud/cmms/envs/*/event-data-provider-configs.textproto'
      - '.github/workflows/scripts/prepare_edp_kms.py'
      - '.github/workflows/deploy-edp-kms.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/edp-kms-terraform.yml'
      - 'src/main/terraform/gcloud/modules/confidential-space-workload-identity/**'
      - 'src/main/terraform/gcloud/modules/edp-aggregator-edp-deployment/**'
      - 'src/main/terraform/gcloud/examples/edp-kms/**'
      - 'src/main/terraform/aws/modules/edp-kms/**'
      - 'src/main/terraform/aws/examples/edp-kms/**'
      - 'src/main/terraform/aws/examples/edp-kms-google-bridge/**'
      - 'src/test/terraform/**'
      - 'src/main/terraform/gcloud/edp-kms/**'
      - 'src/main/terraform/gcloud/modules/edp-kms-attestation-policy/**'
      - 'src/main/terraform/aws/edp-kms/**'
      - '.github/env-configs/edp-kms.json'
      - '.github/env-configs/*/cmms.json'
      - 'cosign-*-pub-key.pem'
      - 'src/main/terraform/gcloud/cmms/envs/*/event-data-provider-configs.textproto'
      - '.github/workflows/scripts/prepare_edp_kms.py'
      - '.github/workflows/deploy-edp-kms.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Validate EDP modules and permissions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false
      - name: Validate configurations and run mocked permission plans
        run: |
          set -euo pipefail
          export TF_PLUGIN_CACHE_DIR="$RUNNER_TEMP/edp-tf-plugins"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          python3 .github/workflows/scripts/prepare_edp_kms.py --output-directory "$RUNNER_TEMP/kms-inputs"
          paths=(
            src/main/terraform/gcloud/edp-kms
            src/main/terraform/gcloud/modules/edp-kms-attestation-policy
            src/main/terraform/aws/edp-kms
            src/main/terraform/gcloud/modules/confidential-space-workload-identity
            src/main/terraform/gcloud/modules/edp-aggregator-edp-deployment
            src/main/terraform/gcloud/examples/edp-kms
            src/main/terraform/aws/modules/edp-kms
            src/main/terraform/aws/examples/edp-kms
            src/main/terraform/aws/examples/edp-kms-google-bridge
            src/test/terraform/gcloud/edp-kms
            src/test/terraform/gcloud/confidential-space-workload-identity
            src/test/terraform/gcloud/edp-aggregator-edp-deployment
            src/test/terraform/aws/edp-kms
          )
          for path in "${paths[@]}"; do
            export TF_DATA_DIR="$RUNNER_TEMP/edp-tf-data/${path//\//_}"
            terraform -chdir="$path" fmt -check -recursive
            terraform -chdir="$path" init -backend=false -input=false
            terraform -chdir="$path" validate
            if [[ "$path" == src/test/* ]]; then
              terraform -chdir="$path" test
            fi
          done
