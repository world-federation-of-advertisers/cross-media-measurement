name: Run EDPA Reporting Integration Test

run-name: >-
  ${{ inputs.seed_only && 'Seed High Overlap Dataset' || 'Run EDPA Reporting Integration Test' }}
  [${{ inputs.environment }}]

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub-managed environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - head
      # DO_NOT_SUBMIT(world-federation-of-advertisers/cross-media-measurement#4661): Remove
      # the seed-only dispatch path after M3.
      seed_only:
        description: "Reseed the high-overlap dataset on dev without running reporting tests"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # DO_NOT_SUBMIT(world-federation-of-advertisers/cross-media-measurement#4661): Remove
  # these seed-only jobs and the run-tests guard after M3.
  validate-seed-only:
    if: ${{ inputs.seed_only }}
    runs-on: ubuntu-24.04
    steps:
      - name: Validate seed-only scope
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$ENVIRONMENT" != dev ]]; then
            echo "Seed-only mode requires a manual dispatch on dev." >&2
            exit 1
          fi

  run-high-overlap-seeding:
    if: ${{ inputs.seed_only }}
    needs: [validate-seed-only]
    uses: ./.github/workflows/high-overlap-seeding.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ inputs.environment }}

  run-tests:
    if: ${{ !inputs.seed_only }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Load CMMS environment configuration
        id: cmms-config
        uses: ./.github/actions/load-cmms-environment
        with:
          environment: ${{ inputs.environment }}

      - name: Set up Bazel
        uses: world-federation-of-advertisers/actions/setup-bazel@390a9ea948eef416333f8c257ef6116552a42d23 # v2.6.0

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ fromJSON(steps.cmms-config.outputs.config).WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ fromJSON(steps.cmms-config.outputs.config).TF_SERVICE_ACCOUNT }}

      - name: Write auth.bazelrc
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          cat << EOF > auth.bazelrc
          build --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY
          EOF

      - name: Write ~/.bazelrc
        env:
          MC_API_KEY: ${{ secrets.MC_API_KEY }}
          STORAGE_BUCKET: secure-computation-storage-${{ inputs.environment }}-bucket
        run: |
          cat << EOF > ~/.bazelrc
          common --config=ci
          build --define kingdom_public_api_target=$KINGDOM_PUBLIC_API_TARGET
          build --define mc_name=$MC_NAME
          build --define mc_api_key=$MC_API_KEY
          build --define storage_bucket=$STORAGE_BUCKET
          build --define reporting_service_endpoint=$REPORTING_SERVICE_ENDPOINT
          build --define reporting_token_audience=$REPORTING_TOKEN_AUDIENCE
          build --define reporting_public_api_target=$REPORTING_PUBLIC_API_TARGET
          build --define access_public_api_target=$ACCESS_PUBLIC_API_TARGET
          build --define high_overlap_model_line=$HIGH_OVERLAP_MODEL_LINE
          test --test_output=streamed
          test --test_timeout=6000
          EOF

      - name: Wait for Kingdom public API
        uses: ./.github/actions/wait-for-kingdom
        with:
          kingdom-public-api-target: ${{ fromJSON(steps.cmms-config.outputs.config).KINGDOM_PUBLIC_API_TARGET }}
          kingdom-public-api-cert-host: localhost
          model-line-name: ${{ fromJSON(steps.cmms-config.outputs.config).HIGH_OVERLAP_MODEL_LINE }}

      # Reduce chance of disconnection from the Build Event Service.
      - name: Set TCP keepalive
        run: sudo sysctl -w net.ipv4.tcp_keepalive_time=60

      - name: Run tests
        id: run-tests
        run: |
          bazel test \
          --test_env=GOOGLE_APPLICATION_CREDENTIALS \
          --test_env=GOOGLE_CLOUD_PROJECT \
          //src/test/kotlin/org/wfanet/measurement/integration/k8s:EdpAggregatorReportingIntegrationTest

      - name: Upload Bazel testlogs
        continue-on-error: true
        uses: world-federation-of-advertisers/actions/bazel-upload-testlogs@390a9ea948eef416333f8c257ef6116552a42d23 # v2.6.0
        if: failure() && steps.run-tests.outcome == 'failure'
