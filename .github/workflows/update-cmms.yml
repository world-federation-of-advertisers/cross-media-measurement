name: Update CMMS

run-name: >-
  Update CMMS [${{ inputs.environment }}] |
  apply=${{ inputs.apply }},
  test=${{ inputs.run-tests }},
  image-tag=${{ inputs.existing-image-tag }}

concurrency:
  group: update-cmms-${{ inputs.environment }}
  cancel-in-progress: false

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      run-tests:
        description: "Run tests"
        type: boolean
        default: true
      apply:
        description: "Apply the new configuration"
        type: boolean
        required: true
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub-managed environment"
        required: true
        type: choice
        options:
        - dev
        - qa
        - head
      run-tests:
        description: "Run tests"
        type: boolean
        default: true
      apply:
        description: "Apply the new configuration"
        type: boolean
        default: false
      existing-image-tag:
        description: "Tag of existing published images (skips push)"
        type: string

permissions:
  contents: read

jobs:
  publish-images:
    uses: ./.github/workflows/maybe-push-images.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      existing-image-tag: ${{ inputs.existing-image-tag }}
      use-release-key: ${{ inputs.environment == 'qa' && github.actor == 'github-actions[bot]' }}

  scan-images:
    uses: ./.github/workflows/scan-images.yml
    needs: [publish-images]
    if: inputs.existing-image-tag == ''
    permissions:
      contents: read
      security-events: write
    with:
      container-registry: ghcr.io
      image-repo-prefix: ${{ github.repository_owner }}
      image-tag: ${{ needs.publish-images.outputs.image-tag }}

  validate-direct-dispatch-config:
    name: Validate direct-dispatch configuration
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Set up Bazel
      uses: world-federation-of-advertisers/actions/setup-bazel@a9407321ceb8da9912face58a8139603678c869d # v2.5.0

    - name: Write auth.bazelrc
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        cat << EOF > auth.bazelrc
        build --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY
        EOF

    - name: Write ~/.bazelrc
      run: |
        cat << EOF > ~/.bazelrc
        common --config=ci
        EOF

    - name: Write validation inputs
      env:
        CONFIG_DIR: ${{ runner.temp }}/configs
        DATA_WATCHER_CONFIG_CONTENT: ${{ vars.DATA_WATCHER_CONFIG_CONTENT }}
        REQUISITION_FETCHER_CONFIG_CONTENT: ${{ vars.REQUISITION_FETCHER_CONFIG_CONTENT }}
      run: |
        set -euo pipefail
        mkdir -p "$CONFIG_DIR"
        printf '%s' "$DATA_WATCHER_CONFIG_CONTENT" > "$CONFIG_DIR/data-watcher-config.textproto"
        printf '%s' "$REQUISITION_FETCHER_CONFIG_CONTENT" > "$CONFIG_DIR/requisition-fetcher-config.textproto"

    - name: Validate RequisitionFetcher and DataWatcher configuration
      env:
        CONFIG_DIR: ${{ runner.temp }}/configs
        SECURE_COMPUTATION_PUBLIC_API_TARGET: ${{ vars.SECURE_COMPUTATION_PUBLIC_API_TARGET }}
      run: |
        bazelisk run \
          //src/main/kotlin/org/wfanet/measurement/edpaggregator/deploy/gcloud/requisitionfetcher:ValidateRequisitionFetcherConfig \
          -- \
          --requisition-fetcher-config="$CONFIG_DIR/requisition-fetcher-config.textproto" \
          --data-watcher-config="$CONFIG_DIR/data-watcher-config.textproto" \
          --control-plane-target="$SECURE_COMPUTATION_PUBLIC_API_TARGET"

  update-secure-computation-dlq-paused:
    uses: ./.github/workflows/configure-secure-computation-control-plane.yml
    needs: [publish-images, validate-direct-dispatch-config]
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      image-tag: ${{ needs.publish-images.outputs.image-tag }}
      environment: ${{ inputs.environment }}
      apply: ${{ inputs.apply }}
      dead-letter-processing-enabled: false
      work-item-publication-enabled: false

  terraform-quiesced:
    uses: ./.github/workflows/terraform-cmms-v2.yml
    needs: [publish-images, update-secure-computation-dlq-paused]
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      packages: read
    with:
      environment: ${{ inputs.environment }}
      apply: ${{ inputs.apply }}
      image-tag: ${{ needs.publish-images.outputs.image-tag }}
      tee-consumers-enabled: false
      requisition-fetcher-enabled: false

  wait-for-tee-consumers-to-stop:
    runs-on: ubuntu-24.04
    needs: [terraform-quiesced]
    permissions:
      contents: read
      id-token: write
    environment: ${{ inputs.environment }}
    steps:
    - name: Authenticate to Google Cloud
      if: ${{ inputs.apply }}
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ vars.TF_SERVICE_ACCOUNT }}

    - name: Wait for WorkItem TEE consumers to stop
      if: ${{ inputs.apply }}
      env:
        GCLOUD_REGION: ${{ vars.GCLOUD_REGION }}
        MIG_NAMES_JSON: ${{ needs.terraform-quiesced.outputs.work_item_tee_mig_names }}
      run: |
        set -euo pipefail
        if [[ -z "$MIG_NAMES_JSON" ]]; then
          echo "::error::Terraform returned no WorkItem TEE MIG output"
          exit 1
        fi
        mapfile -t mig_names < <(jq -r '.[]' <<< "$MIG_NAMES_JSON")
        if (( ${#mig_names[@]} == 0 )); then
          echo "::error::Terraform returned no WorkItem TEE MIG names"
          exit 1
        fi
        for mig in "${mig_names[@]}"; do
          gcloud compute instance-groups managed wait-until "$mig" \
            --stable \
            --region="$GCLOUD_REGION" \
            --timeout=600
          target_size=$(gcloud compute instance-groups managed describe "$mig" \
            --region="$GCLOUD_REGION" \
            --format='value(targetSize)')
          instance_count=$(gcloud compute instance-groups managed list-instances "$mig" \
            --region="$GCLOUD_REGION" \
            --format=json | jq 'length')
          if [[ "$target_size" != "0" || "$instance_count" != "0" ]]; then
            echo "::error::MIG $mig is not empty: targetSize=$target_size instances=$instance_count"
            exit 1
          fi
        done

    - name: Wait for in-flight RequisitionFetcher invocation to finish
      if: ${{ inputs.apply }}
      run: sleep 600

  update-kingdom:
    uses: ./.github/workflows/configure-kingdom.yml
    needs: [publish-images, wait-for-tee-consumers-to-stop]
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      image-tag: ${{ needs.publish-images.outputs.image-tag }}
      environment: ${{ inputs.environment }}
      apply: ${{ inputs.apply }}

  update-population-fulfiller:
    uses: ./.github/workflows/configure-population-fulfiller.yml
    needs: [publish-images, update-kingdom]
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      image-tag: ${{ needs.publish-images.outputs.image-tag }}
      environment: ${{ inputs.environment }}
      apply: ${{ inputs.apply }}

  update-secure-computation:
    uses: ./.github/workflows/configure-secure-computation-control-plane.yml
    needs: [publish-images, wait-for-tee-consumers-to-stop, update-kingdom]
    secrets: inherit
    permissions:
      contents: read
      id-token: write    
    with:
      image-tag: ${{ needs.publish-images.outputs.image-tag }}
      environment: ${{ inputs.environment }}
      apply: ${{ inputs.apply }}
      dead-letter-processing-enabled: true
      work-item-publication-enabled: true

  update-edp-aggregator-service:
    uses: ./.github/workflows/configure-edp-aggregator.yml
    needs: [publish-images, wait-for-tee-consumers-to-stop, update-kingdom, update-secure-computation]
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      image-tag: ${{ needs.publish-images.outputs.image-tag }}
      environment: ${{ inputs.environment }}
      apply: ${{ inputs.apply }}

  terraform:
    uses: ./.github/workflows/terraform-cmms-v2.yml
    needs: [publish-images, update-secure-computation, update-edp-aggregator-service]
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      packages: read
    with:
      environment: ${{ inputs.environment }}
      apply: ${{ inputs.apply }}
      image-tag: ${{ needs.publish-images.outputs.image-tag }}
      tee-consumers-enabled: true
      requisition-fetcher-enabled: true

  update-aggregator-duchy:
    uses: ./.github/workflows/configure-duchy.yml
    needs: [publish-images, terraform]
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      duchy-name: aggregator
      image-tag: ${{ needs.publish-images.outputs.image-tag }}
      environment: ${{ inputs.environment }}
      apply: ${{ inputs.apply }}

  update-worker1-duchy:
    uses: ./.github/workflows/configure-duchy.yml
    needs: [publish-images, terraform]
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      duchy-name: worker1
      image-tag: ${{ needs.publish-images.outputs.image-tag }}
      environment: ${{ inputs.environment }}
      apply: ${{ inputs.apply }}

  update-worker2-duchy:
    uses: ./.github/workflows/configure-duchy.yml
    needs: [publish-images, terraform]
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      duchy-name: worker2
      image-tag: ${{ needs.publish-images.outputs.image-tag }}
      environment: ${{ inputs.environment }}
      apply: ${{ inputs.apply }}

  update-simulators:
    uses: ./.github/workflows/configure-simulators.yml
    needs: [publish-images, terraform]
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      image-tag: ${{ needs.publish-images.outputs.image-tag }}
      environment: ${{ inputs.environment }}
      apply: ${{ inputs.apply }}

  # Update the Reporting system.
  #
  # This isn't technically part of the CMMS, but we do it here for simplicity.
  update-reporting-v2:
    uses: ./.github/workflows/configure-reporting-v2.yml
    secrets: inherit
    needs: [ publish-images, terraform ]
    permissions:
      contents: read
      id-token: write
    with:
      image-tag: ${{ needs.publish-images.outputs.image-tag }}
      environment: ${{ inputs.environment }}
      apply: ${{ inputs.apply }}

  run-tests:
    if: inputs.run-tests
    needs: [
      update-kingdom,
      update-population-fulfiller,
      update-aggregator-duchy,
      update-worker1-duchy,
      update-worker2-duchy,
      update-simulators,
      update-reporting-v2,
      update-secure-computation,
      update-edp-aggregator-service
    ]
    uses: ./.github/workflows/run-k8s-tests.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ inputs.environment }}

  # Runs after run-edpa-reporting-integration-test, which seeds EventGroups for the same EDPs;
  # concurrent EventGroupSync runs for one EDP race. That job is skipped unless requested and may
  # fail independently, so each deployment job is required explicitly instead.
  run-edpa-cloud-test:
    if: >-
      ${{ inputs.run-tests && !cancelled()
      && needs.update-kingdom.result == 'success'
      && needs.update-population-fulfiller.result == 'success'
      && needs.update-aggregator-duchy.result == 'success'
      && needs.update-worker1-duchy.result == 'success'
      && needs.update-worker2-duchy.result == 'success'
      && needs.update-simulators.result == 'success'
      && needs.update-reporting-v2.result == 'success'
      && needs.update-secure-computation.result == 'success'
      && needs.update-edp-aggregator-service.result == 'success' }}
    needs: [
      update-kingdom,
      update-population-fulfiller,
      update-aggregator-duchy,
      update-worker1-duchy,
      update-worker2-duchy,
      update-simulators,
      update-reporting-v2,
      update-secure-computation,
      update-edp-aggregator-service,
      run-edpa-reporting-integration-test
    ]
    uses: ./.github/workflows/edpa-cloud-test.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ inputs.environment }}

  run-event-group-sync-scale-test:
    if: inputs.run-tests && inputs.environment != 'dev'
    needs: [run-edpa-cloud-test]
    uses: ./.github/workflows/event-group-sync-scale-test.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ inputs.environment }}

  # Provisions the high overlap dataset and reports over it.
  run-edpa-reporting-integration-test:
    if: inputs.run-tests
    needs: [
      update-kingdom,
      update-population-fulfiller,
      update-aggregator-duchy,
      update-worker1-duchy,
      update-worker2-duchy,
      update-simulators,
      update-reporting-v2,
      update-secure-computation,
      update-edp-aggregator-service
    ]
    uses: ./.github/workflows/edpa-reporting-integration-test.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ inputs.environment }}


  run-dashboard-isolation-test:
    if: inputs.run-tests
    needs: [terraform, run-tests, run-edpa-cloud-test]
    uses: ./.github/workflows/dashboard-isolation-test.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ inputs.environment }}

  run-dashboard-compliance-check:
    if: inputs.run-tests
    needs: [terraform, run-tests, run-edpa-cloud-test]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Bazel
        uses: world-federation-of-advertisers/actions/setup-bazel@a9407321ceb8da9912face58a8139603678c869d # v2.5.0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.TF_SERVICE_ACCOUNT }}

      - name: Write auth.bazelrc
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          cat << EOF > auth.bazelrc
          build --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY
          EOF

      - name: Write ~/.bazelrc
        run: |
          cat << EOF > ~/.bazelrc
          common --config=ci
          EOF

      - name: Run Compliance Check
        env:
          DASHBOARD_CONFIG_CONTENT: ${{ vars.DASHBOARD_CONFIG_CONTENT }}
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCLOUD_PROJECT }}
        run: |
          set -euo pipefail
          # Dashboard config is consolidated into DASHBOARD_CONFIG_CONTENT;
          # the check parses it against the DashboardConfig proto schema.
          printf '%s' "$DASHBOARD_CONFIG_CONTENT" > "${RUNNER_TEMP}/dashboard-config.json"
          bazel run //src/main/kotlin/org/wfanet/measurement/edpaggregator/deploy/gcloud/dashboard/tools:DashboardComplianceCheck -- \
            --impersonate-service-account="dashboard-compliance@$GOOGLE_CLOUD_PROJECT.iam.gserviceaccount.com" \
            --project="$GOOGLE_CLOUD_PROJECT" \
            --dashboard-config="${RUNNER_TEMP}/dashboard-config.json"

  # Calls the deployed Meta impression-query function with edp-components' DeployedFunctionTest,
  # checked out at the commit the pinned artifact version was built from. Skipped when the
  # environment does not pin a version, i.e. the function is not deployed there.
  run-meta-impression-query-test:
    # A plan-only run leaves the deployed function unchanged, so only test after an apply.
    if: inputs.run-tests && inputs.apply
    needs: [terraform]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      packages: read
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Resolve test target
        id: target
        env:
          TFVARS_FILE: src/main/terraform/gcloud/cmms/envs/${{ inputs.environment }}.tfvars
          # One JSON source for the Meta function's per-environment settings; the test target is
          # its "test" object. Kept out of the public tfvars because it names a real campaign.
          CONFIG_CONTENT: ${{ vars.META_IMPRESSION_QUERY_CONFIG_CONTENT }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^meta_impression_query_artifact_version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$TFVARS_FILE")"
          if [[ -z "$version" ]]; then
            echo "meta_impression_query_artifact_version is not set; the function is not deployed"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The test code must match the deployed artifact, so the version has to name its source.
          if [[ "$version" =~ ^0\.0\.0-([0-9a-f]{12})$ ]]; then
            # actions/checkout needs the full commit SHA, not the 12-character prefix in the version.
            ref="$(gh api "repos/world-federation-of-advertisers/edp-components/commits/${BASH_REMATCH[1]}" -q .sha)"
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            ref="v$version"
          else
            echo "Cannot map meta_impression_query_artifact_version '$version' to a source revision" >&2
            exit 1
          fi
          # The test skips rather than fails when unconfigured, so a missing target is an error here.
          fail() { echo "$1" >&2; exit 1; }
          [[ -n "$CONFIG_CONTENT" ]] || fail "vars.META_IMPRESSION_QUERY_CONFIG_CONTENT is empty"
          read_field() {
            local value
            value="$(jq -r --arg f "$1" '.test[$f] // empty' <<<"$CONFIG_CONTENT")"
            [[ -n "$value" ]] || fail "META_IMPRESSION_QUERY_CONFIG_CONTENT.test.$1 is missing"
            printf '%s' "$value"
          }
          expected="$(read_field expected_impressions)"
          # An impression total for an identified entity is advertiser data; keep it out of the log.
          echo "::add-mask::$expected"
          {
            echo "META_TEST_ENTITY_ID=$(read_field entity_id)"
            echo "META_TEST_ENTITY_TYPE=$(read_field entity_type)"
            echo "META_TEST_START_EPOCH_SECONDS=$(read_field start_epoch_seconds)"
            echo "META_TEST_END_EPOCH_SECONDS=$(read_field end_epoch_seconds)"
            echo "META_TEST_EXPECTED_IMPRESSIONS=$expected"
          } >> "$GITHUB_ENV"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: steps.target.outputs.skip == 'false'
        with:
          repository: world-federation-of-advertisers/edp-components
          ref: ${{ steps.target.outputs.ref }}
          path: edp-components

      # edp-components resolves common-testing from GitHub Packages, which needs credentials.
      - name: Configure Maven credentials
        if: steps.target.outputs.skip == 'false'
        env:
          PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGES_USER: ${{ github.actor }}
        run: |
          printf 'machine maven.pkg.github.com\nlogin %s\npassword %s\n' \
            "$PACKAGES_USER" "$PACKAGES_TOKEN" > ~/.netrc
          chmod 600 ~/.netrc

      - name: Set up Bazel
        if: steps.target.outputs.skip == 'false'
        uses: world-federation-of-advertisers/actions/setup-bazel@a9407321ceb8da9912face58a8139603678c869d # v2.5.0

      - name: Authenticate to Google Cloud
        if: steps.target.outputs.skip == 'false'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.TF_SERVICE_ACCOUNT }}

      # Calls as the Results Fulfiller, the only identity bound as invoker, so the test proves the
      # production caller can reach the function.
      - name: Run DeployedFunctionTest
        if: steps.target.outputs.skip == 'false'
        working-directory: edp-components
        env:
          GCLOUD_PROJECT: ${{ vars.GCLOUD_PROJECT }}
          GCLOUD_REGION: ${{ vars.GCLOUD_REGION }}
        run: |
          set -euo pipefail
          export META_TEST_FUNCTION_URL="$(gcloud functions describe meta-impression-query \
            --gen2 --project="$GCLOUD_PROJECT" --region="$GCLOUD_REGION" \
            --format='value(serviceConfig.uri)')"
          export META_TEST_ID_TOKEN="$(gcloud auth print-identity-token \
            --impersonate-service-account="results-fulfiller-sa@${GCLOUD_PROJECT}.iam.gserviceaccount.com" \
            --audiences="$META_TEST_FUNCTION_URL" --include-email)"
          echo "::add-mask::$META_TEST_ID_TOKEN"
          bazel test //src/test/kotlin/org/wfanet/measurement/edpcomponents/meta:DeployedFunctionTest \
            --test_env=META_TEST_FUNCTION_URL \
            --test_env=META_TEST_ID_TOKEN \
            --test_env=META_TEST_ENTITY_ID \
            --test_env=META_TEST_ENTITY_TYPE \
            --test_env=META_TEST_START_EPOCH_SECONDS \
            --test_env=META_TEST_END_EPOCH_SECONDS \
            --test_env=META_TEST_EXPECTED_IMPRESSIONS \
            --test_output=errors \
            --nocache_test_results

  send-slack-notification:
    uses: ./.github/workflows/slack-nightly-build-notification.yml
    needs: [ publish-images, run-tests, run-edpa-cloud-test, run-event-group-sync-scale-test, run-edpa-reporting-integration-test, run-dashboard-isolation-test, run-dashboard-compliance-check, run-meta-impression-query-test, update-secure-computation, scan-images ]
    secrets: inherit
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/nightly/') && github.actor == 'github-actions[bot]' }}
    with:
      nightly-build-tag: ${{ github.ref_name }}
      successfully-deployed: ${{ needs.publish-images.result == 'success' && needs.run-tests.result == 'success' && needs.run-edpa-cloud-test.result == 'success' && (inputs.environment == 'dev' || needs.run-event-group-sync-scale-test.result == 'success') && needs.run-edpa-reporting-integration-test.result == 'success' && needs.run-dashboard-isolation-test.result == 'success' && needs.run-dashboard-compliance-check.result == 'success' && needs.run-meta-impression-query-test.result == 'success' && needs.update-secure-computation.result == 'success' && needs.scan-images.result == 'success' }}
