name: Sign container images

on:
  workflow_call:
    inputs:
      image-tag:
        description: "Tag of container images"
        type: string
        required: true
      image-manifest-artifact:
        description: "Artifact containing the published image digests and signing tool"
        type: string
        required: true
      kms-key-resource-name:
        description: "GCP KMS key resource name for image signing"
        type: string
        required: true
      service-account:
        description: "Service account to access the key"
        type: string
        required: true
      workload-identity-provider:
        description: "Workload identity provider to impersonate the service account"
        type: string
        required: true

permissions:
  contents: read

jobs:
  sign-images:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      CONTAINER_REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download published image manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.image-manifest-artifact }}
          path: ${{ runner.temp }}/published-images

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Authenticate to Google Cloud for image signing
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ inputs.workload-identity-provider }}
          service_account: ${{ inputs.service-account }}

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - id: get-public-key
        name: Get public key for cosign annotation
        env:
          GCP_KMS_KEY_RESOURCE_NAME: ${{ inputs.kms-key-resource-name }}
        run: |
          set -euo pipefail
          gcloud kms keys versions get-public-key "${GCP_KMS_KEY_RESOURCE_NAME}" --output-file pubkey.pem

          # See step 3 in https://codelabs.developers.google.com/signed-container-image-codelab#2
          encoded_pub_key=$(cat pubkey.pem | openssl base64 | tr -d '[:space:]' | sed 's/[=]*$//')

          echo "encoded_pub_key=${encoded_pub_key}" >> "$GITHUB_OUTPUT"

      - name: Sign published image digests
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
          GCP_KMS_KEY_FOR_SIGNING: "gcpkms://${{ inputs.kms-key-resource-name }}"
          PUBLIC_KEY: ${{ steps.get-public-key.outputs.encoded_pub_key }}
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/published-images/cosign"
          python3 .github/workflows/scripts/sign_image_manifest.py \
            --manifest "$RUNNER_TEMP/published-images/images.json" \
            --commit "$GITHUB_SHA" --image-tag "$IMAGE_TAG" \
            --cosign "$RUNNER_TEMP/published-images/cosign" \
            --key "$GCP_KMS_KEY_FOR_SIGNING" --public-key "$PUBLIC_KEY"
