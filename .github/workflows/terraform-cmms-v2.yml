name: Terraform CMMS

run-name: >-
  Terraform CMMS [${{ inputs.environment }}] |
  apply=${{ inputs.apply }},
  image-tag=${{ inputs.image-tag }}

concurrency:
  group: terraform-cmms-${{ inputs.environment }}
  cancel-in-progress: false

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      apply:
        description: "Apply the new configuration"
        type: boolean
        required: true
      image-tag:
        description: Tag of container images
        type: string
        required: true
      tee-consumers-enabled:
        description: Whether Secure Computation WorkItem TEE consumers may run
        type: boolean
        default: true
      requisition-fetcher-enabled:
        description: Whether the RequisitionFetcher scheduler may start new invocations
        type: boolean
        default: true
    outputs:
      work_item_tee_mig_names:
        description: WorkItem-consuming Managed Instance Group names as JSON
        value: ${{ jobs.terraform.outputs.work_item_tee_mig_names }}

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    environment: ${{ inputs.environment }}
    outputs:
      work_item_tee_mig_names: ${{ steps.terraform_outputs.outputs.work_item_tee_mig_names }}
    env:
      GCLOUD_MODULE_PATH: src/main/terraform/gcloud/cmms
      RESULTS_FULFILLER_TRUSTED_CA_CONTENT: ${{ secrets.RESULTS_FULFILLER_TRUSTED_CA_CONTENT }}
      CMMS_OPERATOR_MEMBERS_JSON: ${{ secrets.CMMS_OPERATOR_MEMBERS_JSON }}
      EDP_SIMULATOR_NAMES: '["edp1-simulator", "edp2-simulator", "edp3-simulator", "edp4-simulator", "edp5-simulator", "edp6-simulator"]'

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Load CMMS environment configuration
      id: cmms-config
      uses: ./.github/actions/load-cmms-environment
      with:
        environment: ${{ inputs.environment }}

    - name: Compute commit age
      id: compute-commit-age
      env:
        COMMIT_SHA: ${{ github.sha }}
      run: |
        commit_ts=$(git show --no-patch --pretty="%ct" "${COMMIT_SHA}")
        now_ts=$(date -u +%s)
        days_diff=$(( (now_ts - commit_ts) / 86400 ))
        echo "commit-age-days=${days_diff}" | tee -a "$GITHUB_OUTPUT"

    - name: Check commit age
      if: ${{ fromJSON(steps.compute-commit-age.outputs.commit-age-days) > 5 }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          core.setFailed('This workflow cannot be run from a commit older than 5 days. Commit ${{ github.sha }} was committed ${{ steps.compute-commit-age.outputs.commit-age-days }} days ago')

    - name: Write auth.bazelrc
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        cat << EOF > auth.bazelrc
        build --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY
        EOF

    - name: Write ~/.bazelrc
      run: |
        cat << EOF > ~/.bazelrc
        common --config=ci
        build --remote_download_outputs=all
        EOF

      # Reduce chance of disconnection from the Build Event Service.
    - name: Set TCP keepalive
      run: sudo sysctl -w net.ipv4.tcp_keepalive_time=60

    # Authenticate to Google Cloud. This will export some environment
    # variables, including GCLOUD_PROJECT.
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ fromJSON(steps.cmms-config.outputs.config).WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ fromJSON(steps.cmms-config.outputs.config).TF_SERVICE_ACCOUNT }}

    - name: Set up Java & Maven
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
      with:
        distribution: zulu
        java-version: '17'

    - name: Write Results Fulfiller trusted CA to file
      env:
        TRUSTED_CA_FILE: ${{ runner.temp }}/results-fulfiller-trusted-root-ca.pem
      run: |
        printf '%s\n' "$RESULTS_FULFILLER_TRUSTED_CA_CONTENT" > "$TRUSTED_CA_FILE"
        
    - name: Set up Maven GitHub Packages auth
      run: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml <<EOF
        <settings>
          <servers>
            <server>
              <id>github</id>
              <username>${{ github.actor }}</username>
              <password>${{ secrets.GITHUB_TOKEN }}</password>
            </server>
          </servers>
        </settings>
        EOF

    - name: Set up terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: "1.14.8"

    - id: get-artifact-version
      uses: ./.github/actions/get-maven-artifact-version
      with:
        package-version: ${{ inputs.image-tag }}

    - name: Download Uber JARs using Maven
      id: download-uber-jars
      env:
        ARTIFACT_VERSION: ${{ steps.get-artifact-version.outputs.artifact-version }}
      run: |
        set -euo pipefail
        TEMP_DIR="${RUNNER_TEMP}/uber-jars"
        mkdir -p "$TEMP_DIR"
        echo "Maven repo: $(mvn help:evaluate -Dexpression=settings.localRepository -q -DforceStdout)"

        declare -A coords
        coords[data-watcher]="org.wfanet.measurement.securecomputation.deploy.gcloud.datawatcher:data-watcher:$ARTIFACT_VERSION:jar"
        coords[requisition-fetcher]="org.wfanet.measurement.edpaggregator.deploy.gcloud.requisitionfetcher:requisition-fetcher:$ARTIFACT_VERSION:jar"
        coords[event-group-sync]="org.wfanet.measurement.edpaggregator.deploy.gcloud.eventgroups:event-group-sync:$ARTIFACT_VERSION:jar"
        coords[data-availability-sync]="org.wfanet.measurement.edpaggregator.deploy.gcloud.dataavailability:data-availability-sync:$ARTIFACT_VERSION:jar"
        coords[data-availability-cleanup]="org.wfanet.measurement.edpaggregator.deploy.gcloud.dataavailability:data-availability-cleanup:$ARTIFACT_VERSION:jar"
        coords[data-availability-monitor]="org.wfanet.measurement.edpaggregator.deploy.gcloud.dataavailability:data-availability-monitor:$ARTIFACT_VERSION:jar"
        # TODO(@marcopremier): requires the function jars to be published to GitHub Packages
        # (vid-labeling-dispatcher is on main; vid-labeling-monitor needs PR #4020 merged).
        coords[vid-labeling-dispatcher]="org.wfanet.measurement.edpaggregator.deploy.gcloud.vidlabeling:vid-labeling-dispatcher:$ARTIFACT_VERSION:jar"
        coords[vid-labeling-monitor]="org.wfanet.measurement.edpaggregator.deploy.gcloud.vidlabeling:vid-labeling-monitor:$ARTIFACT_VERSION:jar"
        coords[dashboard-compliance-check]="org.wfanet.measurement.edpaggregator.deploy.gcloud.dashboard.tools:dashboard-compliance-check:$ARTIFACT_VERSION:jar"
        
        LOCAL_REPO=$(mvn help:evaluate -Dexpression=settings.localRepository -q -DforceStdout)

        for key in "${!coords[@]}"; do
          dest_dir="$TEMP_DIR/$key"
          mkdir -p "$dest_dir"
          mvn -U dependency:get \
            -DremoteRepositories=github::default::https://maven.pkg.github.com/world-federation-of-advertisers/cross-media-measurement \
            -Dartifact="${coords[$key]}" 
        
          IFS=':' read -r groupId artifactId version type <<<"${coords[$key]}"
          jar_dir="$LOCAL_REPO/${groupId//./\/}/$artifactId/$version"
          jar_path=$(find "$jar_dir" -maxdepth 1 -type f -name "$artifactId-*.jar" ! -name "*sources*" | head -n1)
          filename="${version}-function.jar"
          cp "$jar_path" "$dest_dir/$filename"
          
          safe_key=${key//-/_}
          echo "${safe_key}_source_path=$dest_dir/$filename" >> "$GITHUB_OUTPUT"
        done

    - name: Build test event proto descriptors
      id: build-test-event-descriptors
      env:
        BAZEL_TARGET_LABEL: "//src/main/proto/wfa/measurement/api/v2alpha/event_templates/testing/v1:test_event_descriptor_set"
      run: |
        bazelisk build "$BAZEL_TARGET_LABEL"
        RELATIVE_PROTO_DESCRIPTORS_PATH=$(bazelisk cquery "$BAZEL_TARGET_LABEL" --output=files)
        ABSOLUTE_PROTO_DESCRIPTORS_PATH="$(realpath "$RELATIVE_PROTO_DESCRIPTORS_PATH")"
        echo "event_proto_descriptors_path=$ABSOLUTE_PROTO_DESCRIPTORS_PATH" >> "$GITHUB_OUTPUT"

    - name: Generate and copy trusted certs
      run: |
        bazelisk build //src/main/k8s/testing/secretfiles:gen_trusted_certs
        cp bazel-bin/src/main/k8s/testing/secretfiles/all_root_certs.pem src/main/k8s/testing/secretfiles/

    - name: Validate direct RequisitionFetcher dispatch configuration
      env:
        CONFIG_DIR: ${{ github.workspace }}/src/main/terraform/gcloud/cmms/envs/${{ inputs.environment }}
        SECURE_COMPUTATION_PUBLIC_API_TARGET: ${{ fromJSON(steps.cmms-config.outputs.config).SECURE_COMPUTATION_PUBLIC_API_TARGET }}
      run: |
        bazelisk run \
          //src/main/kotlin/org/wfanet/measurement/edpaggregator/deploy/gcloud/requisitionfetcher:ValidateRequisitionFetcherConfig \
          -- \
          --requisition-fetcher-config="$CONFIG_DIR/requisition-fetcher-config.textproto" \
          --data-watcher-config="$CONFIG_DIR/data-watcher-config.textproto" \
          --control-plane-target="$SECURE_COMPUTATION_PUBLIC_API_TARGET"

    - name: terraform init
      working-directory: ${{ env.GCLOUD_MODULE_PATH }}
      run: >
        terraform init
        -input=false
        -lockfile=readonly
        -backend-config=envs/${{ inputs.environment }}.backend.hcl

    - id: get-public-key-fingerprint
      name: Get TEE image signing key fingerprint
      env:
        GCP_KMS_KEY_RESOURCE_NAME: ${{ vars.IMAGE_SIGNING_TEST_KEY_RESOURCE_NAME}}
      run: |
        set -euo pipefail
        gcloud kms keys versions get-public-key "${GCP_KMS_KEY_RESOURCE_NAME}" --output-file pub.pem
        KEY_ID=$(openssl pkey -pubin -in pub.pem -outform DER | openssl sha256 | cut -d' ' -f2)
        FINGERPRINT="ECDSA_P256_SHA256:${KEY_ID}"
        echo "fingerprint=${FINGERPRINT}" >> "$GITHUB_OUTPUT"

    - name: Write dashboard tfvars
      working-directory: ${{ env.GCLOUD_MODULE_PATH }}
      env:
        DASHBOARD_CONFIG_FILE: envs/${{ inputs.environment }}/dashboard-config.json
        SPANNER_PROJECT: ${{ fromJSON(steps.cmms-config.outputs.config).GCLOUD_PROJECT }}
        SPANNER_INSTANCE: ${{ fromJSON(steps.cmms-config.outputs.config).SPANNER_INSTANCE }}
      run: |
        set -euo pipefail
        # Dashboard config (EDPs, operators, deletion protection) is consolidated
        # into one committed JSON file. Terraform reads the generated values
        # natively as *.tfvars.json.
        # Fail loudly on a malformed config -- missing/mistyped keys, empty strings,
        # or duplicate EDP names -- rather than silently emitting null (which Terraform
        # treats as unset) or letting a duplicate name collapse in the map below.
        jq -e '
          (.bigquery_region | type == "string" and length > 0)
          and (.deletion_protection | type == "boolean")
          and (.operators | type == "array")
          and (.edps | type == "array" and length > 0)
          and (.edps | all((.name | type == "string" and length > 0)
            and (.resource_id | type == "string" and length > 0)))
          and ((.edps | map(.name)) as $names | ($names | length) == ($names | unique | length))
        ' "$DASHBOARD_CONFIG_FILE" > /dev/null \
          || { echo "$DASHBOARD_CONFIG_FILE is malformed: need non-empty bigquery_region, boolean deletion_protection, operators array, and non-empty edps with unique non-empty name/resource_id" >&2; exit 1; }
        jq '{
          data_provider_resource_ids: ((.edps // [] | map({(.name): .resource_id}) | add) // {}),
          dashboard_operators: .operators,
          dashboard_deletion_protection: .deletion_protection
        }' "$DASHBOARD_CONFIG_FILE" > dashboard.auto.tfvars.json

        cat > dashboard.auto.tfvars << EOF
        edp_aggregator_spanner_project  = "${SPANNER_PROJECT}"
        edp_aggregator_spanner_instance = "${SPANNER_INSTANCE}"
        kingdom_spanner_project         = "${SPANNER_PROJECT}"
        kingdom_spanner_instance        = "${SPANNER_INSTANCE}"
        reporting_spanner_project       = "${SPANNER_PROJECT}"
        reporting_spanner_instance      = "${SPANNER_INSTANCE}"
        EOF

    - name: terraform plan
      env:
        SPANNER_INSTANCE: ${{ fromJSON(steps.cmms-config.outputs.config).SPANNER_INSTANCE }}
        STORAGE_BUCKET: ${{ fromJSON(steps.cmms-config.outputs.config).STORAGE_BUCKET }}
        TERRAFORM_SERVICE_ACCOUNT: ${{ fromJSON(steps.cmms-config.outputs.config).TF_SERVICE_ACCOUNT }}
        POSTGRES_INSTANCE: ${{ fromJSON(steps.cmms-config.outputs.config).POSTGRES_INSTANCE }}
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        RESULTS_FULFILLER_TRUSTED_CA_FILE: ${{ runner.temp }}/results-fulfiller-trusted-root-ca.pem
        KINGDOM_PUBLIC_API_TARGET: ${{ fromJSON(steps.cmms-config.outputs.config).KINGDOM_PUBLIC_API_TARGET }}
        SECURE_COMPUTATION_PUBLIC_API_TARGET: ${{ fromJSON(steps.cmms-config.outputs.config).SECURE_COMPUTATION_PUBLIC_API_TARGET }}
        METADATA_STORAGE_PUBLIC_API_TARGET: ${{ fromJSON(steps.cmms-config.outputs.config).METADATA_STORAGE_PUBLIC_API_TARGET }}
        IMAGE_TAG: ${{ inputs.image-tag }}
        DUCHY_WORKER1_TARGET: ${{ fromJSON(steps.cmms-config.outputs.config).WORKER1_PUBLIC_API_TARGET }}
        DUCHY_WORKER2_TARGET: ${{ fromJSON(steps.cmms-config.outputs.config).WORKER2_PUBLIC_API_TARGET }}
        DUCHY_AGGREGATOR_TARGET: ${{ fromJSON(steps.cmms-config.outputs.config).AGGREGATOR_PUBLIC_API_TARGET }}
        KINGDOM_SYSTEM_API_TARGET: ${{ fromJSON(steps.cmms-config.outputs.config).KINGDOM_SYSTEM_API_TARGET }}
        AGGREGATOR_DUCHY_CERT_ID: ${{ fromJSON(steps.cmms-config.outputs.config).AGGREGATOR_DUCHY_CERT_ID }}
        TRUSTED_IMAGE_SIGNING_FINGERPRINT: ${{ steps.get-public-key-fingerprint.outputs.fingerprint }}
      working-directory: ${{ env.GCLOUD_MODULE_PATH }}
      run: >
        terraform plan
        -input=false
        -var-file=envs/${{ inputs.environment }}.tfvars
        -var="spanner_instance_name=$SPANNER_INSTANCE"
        -var="storage_bucket_name=$STORAGE_BUCKET"
        -var="terraform_service_account=$TERRAFORM_SERVICE_ACCOUNT"
        -var="postgres_instance_name=$POSTGRES_INSTANCE"
        -var="postgres_password=$POSTGRES_PASSWORD"
        -var="kingdom_public_api_target=$KINGDOM_PUBLIC_API_TARGET"
        -var="secure_computation_public_api_target=$SECURE_COMPUTATION_PUBLIC_API_TARGET"
        -var="metadata_storage_public_api_target=$METADATA_STORAGE_PUBLIC_API_TARGET"
        -var="data_watcher_uber_jar_path=${{ steps.download-uber-jars.outputs.data_watcher_source_path }}"
        -var="requisition_fetcher_uber_jar_path=${{ steps.download-uber-jars.outputs.requisition_fetcher_source_path }}"
        -var="event_group_uber_jar_path=${{ steps.download-uber-jars.outputs.event_group_sync_source_path }}"
        -var="data_availability_uber_jar_path=${{ steps.download-uber-jars.outputs.data_availability_sync_source_path }}"
        -var="data_availability_cleanup_uber_jar_path=${{ steps.download-uber-jars.outputs.data_availability_cleanup_source_path }}"
        -var="data_availability_monitor_uber_jar_path=${{ steps.download-uber-jars.outputs.data_availability_monitor_source_path }}"
        -var="vid_labeling_dispatcher_uber_jar_path=${{ steps.download-uber-jars.outputs.vid_labeling_dispatcher_source_path }}"
        -var="vid_labeling_monitor_uber_jar_path=${{ steps.download-uber-jars.outputs.vid_labeling_monitor_source_path }}"
        -var="dashboard_compliance_uber_jar_path=${{ steps.download-uber-jars.outputs.dashboard_compliance_check_source_path }}"
        -var="image_tag=$IMAGE_TAG"
        -var="tee_consumers_enabled=${{ inputs.tee-consumers-enabled }}"
        -var="requisition_fetcher_enabled=${{ inputs.requisition-fetcher-enabled }}"
        -var="results_fulfiller_event_proto_descriptor_path=${{ steps.build-test-event-descriptors.outputs.event_proto_descriptors_path }}"
        -var="duchy_worker1_target=$DUCHY_WORKER1_TARGET"
        -var="duchy_worker2_target=$DUCHY_WORKER2_TARGET"
        -var="duchy_aggregator_target=$DUCHY_AGGREGATOR_TARGET"
        -var="results_fulfiller_trusted_root_ca_collection_file_path=$RESULTS_FULFILLER_TRUSTED_CA_FILE"
        -var="kingdom_system_api_target=$KINGDOM_SYSTEM_API_TARGET"
        -var="duchy_aggregator_cert_id=$AGGREGATOR_DUCHY_CERT_ID"
        -var="edp_simulator_names=$EDP_SIMULATOR_NAMES"
        -var="cmms_operator_members=$CMMS_OPERATOR_MEMBERS_JSON"
        -var="trusted_image_signing_fingerprint=$TRUSTED_IMAGE_SIGNING_FINGERPRINT"
        -out=tfplan

    - name: terraform apply
      if: ${{ inputs.apply }}
      working-directory: ${{ env.GCLOUD_MODULE_PATH }}
      run: terraform apply -input=false tfplan

    - name: Show recent GKE operations after Terraform failure
      if: ${{ failure() }}
      continue-on-error: true
      run: |
        gcloud container operations list \
          --location=- \
          --limit=20 \
          --sort-by=~startTime \
          --format='table(name,operationType,status,startTime,endTime,statusMessage)'

    - name: Read WorkItem TEE MIG names
      id: terraform_outputs
      if: ${{ inputs.apply }}
      working-directory: ${{ env.GCLOUD_MODULE_PATH }}
      run: |
        mig_names=$(terraform output -json work_item_tee_mig_names | jq -c .)
        echo "work_item_tee_mig_names=$mig_names" >> "$GITHUB_OUTPUT"
