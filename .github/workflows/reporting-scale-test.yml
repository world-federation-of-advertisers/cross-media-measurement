name: Run Reporting Scale Test
run-name: Run Reporting Scale Test [${{ inputs.environment }}]

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      reuse-paused-fetcher:
        type: boolean
        default: false
      report-days:
        type: number
        default: 60
      report-start:
        type: string
        default: "2026-04-01"
      event-group-reference-ids:
        type: string
        default: ""
      model-line:
        type: string
        default: ""
      edp-tls-names:
        type: string
        default: "edp7,edpa_meta,edpa_video_pub"
      demographic-breakdown:
        type: string
        default: "age,gender"
      state-counts:
        type: string
        default: "50"
      qualification-filters:
        type: string
        default: "ami,mrc"
      repetitions:
        type: number
        default: 1
      fulfillment-timeout-seconds:
        type: number
        default: 3600
      create-deadline-seconds:
        type: number
        default: 60
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub-managed environment with the selected dataset already seeded"
        type: choice
        required: true
        options: [dev, head, qa]
      reuse-paused-fetcher:
        description: "Reuse the scheduler pause left by your previous failed scale-test attempt"
        type: boolean
        default: false
      report-days:
        description: "Report duration in days (1–91; 60 reuses a sixty-day flight)"
        type: number
        default: 60
      report-start:
        description: "First reporting date in the existing dataset, YYYY-MM-DD"
        type: string
        default: "2026-04-01"
      event-group-reference-ids:
        description: "Existing EventGroup reference IDs, comma-separated; empty uses high overlap all4"
        type: string
        default: ""
      model-line:
        description: "Existing ModelLine resource name; empty uses HIGH_OVERLAP_MODEL_LINE"
        type: string
        default: ""
      edp-tls-names:
        description: "Synthetic EDP TLS fixture names in the order of distinct providers in the selected EventGroups"
        type: string
        default: "edp7,edpa_meta,edpa_video_pub"
      demographic-breakdown:
        description: "Keep age and gender initially; reduce only to isolate a failure"
        type: choice
        default: "age,gender"
        options: ["age,gender", "age", "gender", "none"]
      state-counts:
        description: "Comma-separated counts: 0 has no state cuts; 51 is native grouping including DC"
        type: string
        default: "50"
      qualification-filters:
        description: "ami,mrc; use ami or mrc to isolate a failure"
        type: string
        default: "ami,mrc"
      fulfillment-timeout-seconds:
        description: "Maximum time for each report to finish and verify (60–14400 seconds)"
        type: number
        default: 3600
      create-deadline-seconds:
        description: "HTTP request deadline (1–600 seconds)"
        type: number
        default: 60

permissions:
  contents: read

concurrency:
  group: reporting-scale-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  run-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: ${{ inputs.environment }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Load CMMS environment configuration
        uses: ./.github/actions/load-cmms-environment
        id: cmms-config
        with:
          environment: ${{ inputs.environment }}

      - name: Set up Bazel
        uses: world-federation-of-advertisers/actions/setup-bazel@390a9ea948eef416333f8c257ef6116552a42d23 # v2.6.0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ fromJSON(steps.cmms-config.outputs.config).WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ fromJSON(steps.cmms-config.outputs.config).TF_SERVICE_ACCOUNT }}

      - name: Write auth.bazelrc
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          cat << EOF > auth.bazelrc
          build --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY
          EOF

      - name: Check for other EDPA cloud tests or deployments
        env:
          GH_TOKEN: ${{ github.token }}
          SCALE_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          python3 - <<'PYCHECK'
          import json, os, urllib.request
          names = {'Run EDP Aggregator Cloud Test', 'Run EDPA Reporting Integration Test', 'Update CMMS', 'Run Reporting Scale Test'}
          conflicts = []
          for status in ('in_progress', 'queued'):
              url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs?status={status}&per_page=100"
              request = urllib.request.Request(url, headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}"})
              with urllib.request.urlopen(request) as response:
                  runs = json.load(response)['workflow_runs']
              for run in runs:
                  if str(run['id']) == os.environ['GITHUB_RUN_ID'] or run['name'] not in names:
                      continue
                  if f"[{os.environ['SCALE_ENVIRONMENT']}]" in run['display_title']:
                      conflicts.append(run['html_url'])
          if conflicts:
              raise SystemExit('Wait for these runs to finish before retrying: ' + ', '.join(conflicts))
          PYCHECK

      - name: Verify creation with fetching paused, then verify fulfillment
        id: run-test
        env:
          REPORTING_SCALE_REUSE_PAUSED_FETCHER: ${{ inputs.reuse-paused-fetcher }}
          REPORTING_SCALE_EDP_TLS_NAMES: ${{ inputs.edp-tls-names }}
          REPORTING_SCALE_REPORT_DAYS: ${{ inputs.report-days }}
          REPORTING_SCALE_REPORT_START: ${{ inputs.report-start }}
          REPORTING_SCALE_EVENT_GROUP_REFERENCE_IDS: ${{ inputs.event-group-reference-ids }}
          REPORTING_SCALE_MODEL_LINE: ${{ inputs.model-line }}
          REPORTING_SCALE_DEMOGRAPHIC_FIELDS: ${{ inputs.demographic-breakdown }}
          REPORTING_SCALE_STATE_COUNTS: ${{ inputs.state-counts }}
          REPORTING_SCALE_FILTER_IDS: ${{ inputs.qualification-filters }}
          REPORTING_SCALE_REPETITIONS: ${{ inputs.repetitions || 1 }}
          REPORTING_SCALE_FULFILLMENT_TIMEOUT_SECONDS: ${{ inputs.fulfillment-timeout-seconds }}
          MC_API_KEY: ${{ secrets.MC_API_KEY }}
          REPORTING_SCALE_DEADLINE_SECONDS: ${{ inputs.create-deadline-seconds }}
          REPORTING_SCALE_SEED: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 .github/scripts/run_reporting_scale_test.py

      - name: Summarize reporting scale results
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          output = pathlib.Path('reporting-scale-results')
          output.mkdir(exist_ok=True)
          summary = output / 'summary.json'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as target:
              target.write('## Reporting scale test\n\n')
              if summary.exists():
                  target.write('| States | Days | Demographics | Create (ms) | HTTP | Final state | Metrics | Measurements | Requisitions by EDP | Outcome |\n')
                  target.write('|---:|---:|---|---:|---:|---|---:|---:|---|---|\n')
                  for row in json.loads(summary.read_text()):
                      demographics = ','.join(name for name, key in [('age', 'group_by_age'), ('gender', 'group_by_gender')] if row.get(key)) or 'none'
                      target.write(f"| {row['state_count']} | {row['report_days']} | {demographics} | {row.get('create_ms', '')} | {row.get('create_http_status', '')} | {row.get('state', row.get('after_failure_state', ''))} | {row.get('metric_count', '')} | {row.get('measurement_count', '')} | {row.get('requisitions_per_data_provider', '')} | {row.get('outcome', '')} |\n")
              else:
                  target.write('No summary was produced. Inspect the test log for setup or build failures.\n')
              fetcher = output / 'fetcher-state.json'
              if fetcher.exists():
                  target.write('\nFetcher scheduler: **' + json.loads(fetcher.read_text())['state'] + '**\n')
          PY

      - name: Upload reporting scale results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reporting-scale-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reporting-scale-results

      - name: Upload Bazel testlogs
        if: failure() && steps.run-test.outcome == 'failure'
        continue-on-error: true
        uses: world-federation-of-advertisers/actions/bazel-upload-testlogs@390a9ea948eef416333f8c257ef6116552a42d23 # v2.6.0
