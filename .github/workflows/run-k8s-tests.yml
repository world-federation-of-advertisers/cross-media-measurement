name: Run Kubernetes tests

run-name: Run Kubernetes tests [${{ inputs.environment }}]

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub-managed environment"
        required: true
        type: choice
        options:
        - dev
        - qa
        - head

permissions:
  contents: read
  id-token: write

jobs:
  run-tests:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ vars.GKE_CONFIG_SERVICE_ACCOUNT }}

    - name: Get GKE cluster credentials
      uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
      with:
        cluster_name: reporting-v2
        location: ${{ vars.GCLOUD_ZONE }}

    - name: Write auth.bazelrc
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        cat << EOF > auth.bazelrc
        build --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY
        EOF

    - name: Read simulator EDP config
      id: simulator-edps
      env:
        CONFIG_PATH: .github/env-configs/${{ inputs.environment }}/simulator_edps.json
      run: |
        for key in edp1_name edp2_name edp3_name edp4_name edp5_name edp6_name; do
          value=$(jq -r --arg k "$key" '.[$k]' "$CONFIG_PATH")
          if [ -z "$value" ] || [ "$value" = "null" ]; then
            echo "Missing key '$key' in $CONFIG_PATH" >&2
            exit 1
          fi
          echo "${key}=${value}" >> "$GITHUB_OUTPUT"
        done

    - name: Write ~/.bazelrc
      env:
        KINGDOM_PUBLIC_API_TARGET: ${{ vars.KINGDOM_PUBLIC_API_TARGET }}
        MC_NAME: ${{ vars.MC_NAME }}
        MC_API_KEY: ${{ secrets.MC_API_KEY }}
        GCLOUD_PROJECT: ${{ vars.GCLOUD_PROJECT }}
        REPORTING_PUBLIC_API_TARGET: ${{ vars.REPORTING_PUBLIC_API_TARGET }}
        REPORTING_SERVICE_ENDPOINT: ${{ vars.REPORTING_SERVICE_ENDPOINT }}
        ACCESS_PUBLIC_API_TARGET: ${{ vars.ACCESS_PUBLIC_API_TARGET }}
        REPORTING_TOKEN_AUDIENCE: ${{ vars.REPORTING_TOKEN_AUDIENCE }}
        MCP_HOST: ${{ vars.MCP_HOST }}

        EDP1_NAME: ${{ steps.simulator-edps.outputs.edp1_name }}
        EDP2_NAME: ${{ steps.simulator-edps.outputs.edp2_name }}
        EDP3_NAME: ${{ steps.simulator-edps.outputs.edp3_name }}
        EDP4_NAME: ${{ steps.simulator-edps.outputs.edp4_name }}
        EDP5_NAME: ${{ steps.simulator-edps.outputs.edp5_name }}
        EDP6_NAME: ${{ steps.simulator-edps.outputs.edp6_name }}
        PDP_NAME: ${{ vars.PDP_NAME }}
        MP_NAME: ${{ vars.MP_NAME }}
        MODEL_LINE_NAME: ${{ vars.MODEL_LINE_NAME }}
      run: |
        cat << EOF > ~/.bazelrc
        common --config=ci
        build --define kingdom_public_api_target=$KINGDOM_PUBLIC_API_TARGET
        build --define mc_name=$MC_NAME
        build --define mc_api_key=$MC_API_KEY
        build --define google_cloud_project=$GCLOUD_PROJECT
        build --define reporting_public_api_target=$REPORTING_PUBLIC_API_TARGET
        build --define reporting_service_endpoint=$REPORTING_SERVICE_ENDPOINT
        build --define reporting_token_audience=$REPORTING_TOKEN_AUDIENCE
        build --define "mcp_host=$MCP_HOST"
        build --define access_public_api_target=$ACCESS_PUBLIC_API_TARGET
        build --define basic_reports_enabled=true
        build --define "edp1_name=$EDP1_NAME"
        build --define "edp2_name=$EDP2_NAME"
        build --define "edp3_name=$EDP3_NAME"
        build --define "edp4_name=$EDP4_NAME"
        build --define "edp5_name=$EDP5_NAME"
        build --define "edp6_name=$EDP6_NAME"
        build --define "pdp_name=$PDP_NAME"
        build --define "mp_name=$MP_NAME"
        build --define "model_line_name=$MODEL_LINE_NAME"
        test --test_output=streamed
        test --test_timeout=3600
        EOF

    # Reduce chance of disconnection from the Build Event Service.
    - name: Set TCP keepalive
      run: sudo sysctl -w net.ipv4.tcp_keepalive_time=60

    - name: Run tests through the in-cluster MCP Service
      id: run-tests
      env:
        MCP_ENDPOINT: http://127.0.0.1:18080
        MCP_PROXY_POD: reporting-mcp-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      run: |
        cleanup() {
          if [[ -n "${MCP_PORT_FORWARD_PID:-}" ]]; then
            kill "$MCP_PORT_FORWARD_PID" || true
          fi
          kubectl delete pod "$MCP_PROXY_POD" --ignore-not-found --wait=false || true
          kubectl delete networkpolicy "$MCP_PROXY_POD" --ignore-not-found || true
        }
        trap cleanup EXIT

        kubectl apply -f - <<EOF
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: $MCP_PROXY_POD
        spec:
          podSelector:
            matchLabels:
              app: $MCP_PROXY_POD
          policyTypes:
          - Ingress
          - Egress
          ingress:
          - ports:
            - protocol: TCP
              port: 8080
          egress:
          - to:
            - podSelector:
                matchLabels:
                  app: reporting-mcp-server-app
            ports:
            - protocol: TCP
              port: 8080
        ---
        apiVersion: v1
        kind: Pod
        metadata:
          name: $MCP_PROXY_POD
          labels:
            app: $MCP_PROXY_POD
        spec:
          activeDeadlineSeconds: 7200
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: proxy
            image: registry.k8s.io/busybox:1.27
            command: ["sh", "-c", "nc -ll -p 8080 -e nc reporting-mcp-server 8080"]
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
        EOF

        kubectl wait --for=condition=Ready "pod/$MCP_PROXY_POD" --timeout=60s
        kubectl port-forward "pod/$MCP_PROXY_POD" 18080:8080 \
          >"$RUNNER_TEMP/reporting-mcp-port-forward.log" 2>&1 &
        MCP_PORT_FORWARD_PID=$!
        for attempt in {1..30}; do
          if curl --fail --silent "$MCP_ENDPOINT/healthz" >/dev/null; then
            break
          fi
          if [[ "$attempt" == 30 ]]; then
            cat "$RUNNER_TEMP/reporting-mcp-port-forward.log"
            kubectl logs "$MCP_PROXY_POD" || true
            exit 1
          fi
          sleep 1
        done

        bazelisk test \
          //src/test/kotlin/org/wfanet/measurement/integration/k8s:SyntheticGeneratorCorrectnessTest \
          //src/test/kotlin/org/wfanet/measurement/integration/k8s:ReportingMcpSmokeTest

    - name: Upload Bazel testlogs
      continue-on-error: true
      uses: world-federation-of-advertisers/actions/bazel-upload-testlogs@390a9ea948eef416333f8c257ef6116552a42d23 # v2.6.0
      if: failure() && steps.run-tests.outcome == 'failure'
