name: Meta impression-query test
run-name: Meta impression-query test [${{ inputs.environment }}]

# Calls the deployed Meta impression-query function with edp-components' DeployedFunctionTest,
# checked out at the commit the pinned artifact version was built from. Run by hand after a deploy;
# it queries live Meta, so it is not part of Update CMMS. Skipped when the environment does not pin
# a version, i.e. the function is not deployed there.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub-managed environment"
        required: true
        type: choice
        options:
        - dev
        - qa
        - head

permissions:
  contents: read

jobs:
  run-meta-impression-query-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      packages: read
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Resolve test target
        id: target
        env:
          TFVARS_FILE: src/main/terraform/gcloud/cmms/envs/${{ inputs.environment }}.tfvars
          # One JSON source for the Meta function's per-environment settings; the test target is
          # its "test" object. A secret rather than a variable: it names a real campaign and its
          # impression count, and GitHub prints variables in a step's env block in the public log.
          CONFIG_CONTENT: ${{ secrets.META_IMPRESSION_QUERY_CONFIG_CONTENT }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^meta_impression_query_artifact_version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$TFVARS_FILE")"
          if [[ -z "$version" ]]; then
            echo "meta_impression_query_artifact_version is not set; the function is not deployed"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The test code must match the deployed artifact, so the version has to name its source.
          if [[ "$version" =~ ^0\.0\.0-([0-9a-f]{12})$ ]]; then
            # actions/checkout needs the full commit SHA, not the 12-character prefix in the version.
            ref="$(gh api "repos/world-federation-of-advertisers/edp-components/commits/${BASH_REMATCH[1]}" -q .sha)"
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            ref="v$version"
          else
            echo "Cannot map meta_impression_query_artifact_version '$version' to a source revision" >&2
            exit 1
          fi
          # The test skips rather than fails when unconfigured, so a missing target is an error here.
          fail() { echo "$1" >&2; exit 1; }
          [[ -n "$CONFIG_CONTENT" ]] || fail "secrets.META_IMPRESSION_QUERY_CONFIG_CONTENT is empty"
          read_field() {
            local value
            value="$(jq -r --arg f "$1" '.test[$f] // empty' <<<"$CONFIG_CONTENT")"
            [[ -n "$value" ]] || fail "META_IMPRESSION_QUERY_CONFIG_CONTENT.test.$1 is missing"
            printf '%s' "$value"
          }
          expected="$(read_field expected_impressions)"
          # An impression total for an identified entity is advertiser data; keep it out of the log.
          echo "::add-mask::$expected"
          {
            echo "META_TEST_ENTITY_ID=$(read_field entity_id)"
            echo "META_TEST_ENTITY_TYPE=$(read_field entity_type)"
            echo "META_TEST_START_EPOCH_SECONDS=$(read_field start_epoch_seconds)"
            echo "META_TEST_END_EPOCH_SECONDS=$(read_field end_epoch_seconds)"
            echo "META_TEST_EXPECTED_IMPRESSIONS=$expected"
            # Optional: the EventGroup of the lookup-test campaign, which enables the EventGroup
            # lookup test. The Kingdom assigns its ID, so it differs per environment.
            echo "META_TEST_EVENT_GROUP=$(jq -r '.test.event_group // empty' <<<"$CONFIG_CONTENT")"
          } >> "$GITHUB_ENV"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: steps.target.outputs.skip == 'false'
        with:
          repository: world-federation-of-advertisers/edp-components
          ref: ${{ steps.target.outputs.ref }}
          path: edp-components

      # edp-components resolves common-testing from GitHub Packages, which needs credentials.
      - name: Configure Maven credentials
        if: steps.target.outputs.skip == 'false'
        env:
          PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGES_USER: ${{ github.actor }}
        run: |
          printf 'machine maven.pkg.github.com\nlogin %s\npassword %s\n' \
            "$PACKAGES_USER" "$PACKAGES_TOKEN" > ~/.netrc
          chmod 600 ~/.netrc

      - name: Set up Bazel
        if: steps.target.outputs.skip == 'false'
        uses: world-federation-of-advertisers/actions/setup-bazel@a9407321ceb8da9912face58a8139603678c869d # v2.5.0

      - name: Authenticate to Google Cloud
        if: steps.target.outputs.skip == 'false'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.TF_SERVICE_ACCOUNT }}

      # Calls as the Results Fulfiller, the only identity bound as invoker, so the test proves the
      # production caller can reach the function.
      - name: Run DeployedFunctionTest
        if: steps.target.outputs.skip == 'false'
        working-directory: edp-components
        env:
          GCLOUD_PROJECT: ${{ vars.GCLOUD_PROJECT }}
          GCLOUD_REGION: ${{ vars.GCLOUD_REGION }}
        run: |
          set -euo pipefail
          export META_TEST_FUNCTION_URL="$(gcloud functions describe meta-impression-query \
            --gen2 --project="$GCLOUD_PROJECT" --region="$GCLOUD_REGION" \
            --format='value(serviceConfig.uri)')"
          export META_TEST_ID_TOKEN="$(gcloud auth print-identity-token \
            --impersonate-service-account="results-fulfiller-sa@${GCLOUD_PROJECT}.iam.gserviceaccount.com" \
            --audiences="$META_TEST_FUNCTION_URL" --include-email)"
          echo "::add-mask::$META_TEST_ID_TOKEN"
          echo "META_TEST_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          bazel test //src/test/kotlin/org/wfanet/measurement/edpcomponents/meta:DeployedFunctionTest \
            --test_env=META_TEST_FUNCTION_URL \
            --test_env=META_TEST_ID_TOKEN \
            --test_env=META_TEST_ENTITY_ID \
            --test_env=META_TEST_ENTITY_TYPE \
            --test_env=META_TEST_START_EPOCH_SECONDS \
            --test_env=META_TEST_END_EPOCH_SECONDS \
            --test_env=META_TEST_EXPECTED_IMPRESSIONS \
            --test_env=META_TEST_EVENT_GROUP \
            --test_output=errors \
            --nocache_test_results

      # DeployedFunctionTest only sees the response, which is the same whether or not the EventGroup
      # lookup succeeded. A successful lookup records the fixture's ad account as inaccessible, at
      # the time of the query, in meta.account_access.last_observed.
      - name: Check that the EventGroup lookup resolved the ad account
        if: steps.target.outputs.skip == 'false' && env.META_TEST_EVENT_GROUP != ''
        env:
          GCLOUD_PROJECT: ${{ vars.GCLOUD_PROJECT }}
          # The ad_account_id, without its act_ prefix, of the lookup-test EventGroup in every
          # environment.
          LOOKUP_TEST_AD_ACCOUNT_ID: "9000000000000001"
        run: |
          set -euo pipefail
          filter="metric.type=\"workload.googleapis.com/meta.account_access.last_observed\""
          filter+=" AND metric.labels.account_id=\"$LOOKUP_TEST_AD_ACCOUNT_ID\""
          filter+=" AND metric.labels.result=\"inaccessible\""
          start="$(date -u -d "@$META_TEST_STARTED_AT" +%Y-%m-%dT%H:%M:%SZ)"
          # Cloud Monitoring can take a few minutes to make a point queryable.
          for attempt in $(seq 1 20); do
            observed="$(curl -sS --fail-with-body -G \
              -H "Authorization: Bearer $(gcloud auth print-access-token)" \
              "https://monitoring.googleapis.com/v3/projects/$GCLOUD_PROJECT/timeSeries" \
              --data-urlencode "filter=$filter" \
              --data-urlencode "interval.startTime=$start" \
              --data-urlencode "interval.endTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              | jq '[.timeSeries[]?.points[]?.value.int64Value | tonumber] | max // 0')"
            if (( observed >= META_TEST_STARTED_AT )); then
              echo "The lookup recorded ad account $LOOKUP_TEST_AD_ACCOUNT_ID as inaccessible"
              exit 0
            fi
            sleep 30
          done
          echo "No meta.account_access.last_observed point for the lookup-test ad account since" \
            "the test started: the EventGroup lookup did not resolve it" >&2
          exit 1
