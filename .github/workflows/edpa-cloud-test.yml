# DO_NOT_SUBMIT: temporary task-owned cleanup transport.
# Temporary task-owned ref only. Existing registered workflow supplies the existing DEV WIF identity.
name: Recorded VID test cleanup
run-name: Recorded VID test cleanup [dev] ${{ inputs.cleanup-mode }}
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        default: dev
        options: [dev]
      cleanup-mode:
        type: choice
        required: true
        default: inventory
        options: [inventory, gcs-reporting, spanner, verify]
      execution-plan-sha:
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: vid-cloud-owned-cleanup-01a1d445
  cancel-in-progress: false
jobs:
  recorded-cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      GOOGLE_CLOUD_PROJECT: halo-cmm-dev
      CLOUDSDK_CORE_PROJECT: halo-cmm-dev
      CI_REVIEWED_SOURCE_INDEX_SHA: 7d962ec14d03a4717447e9abc8068ba67bd96ca379e088f385ac6efa61db1c52
      CI_CLEANUP_MODE: ${{ inputs.cleanup-mode }}
      CI_EXECUTION_PLAN_SHA: ${{ inputs.execution-plan-sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Validate fixed scope and reviewed mode before authentication
        run: python3 .github/vid-cloud-cleanup/01a1d445/validate-mode.py
      - name: Load existing DEV environment configuration
        id: cmms-config
        uses: ./.github/actions/load-cmms-environment
        with:
          environment: dev
      - name: Authenticate with the same existing Main WIF and TF identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ fromJSON(steps.cmms-config.outputs.config).WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ fromJSON(steps.cmms-config.outputs.config).TF_SERVICE_ACCOUNT }}
      - name: Validate existing identity without exposing credentials
        env:
          EXPECTED_SERVICE_ACCOUNT: ${{ fromJSON(steps.cmms-config.outputs.config).TF_SERVICE_ACCOUNT }}
          EXPECTED_PROJECT: ${{ fromJSON(steps.cmms-config.outputs.config).GCLOUD_PROJECT }}
          EXPECTED_WIF_PROVIDER: ${{ fromJSON(steps.cmms-config.outputs.config).WORKLOAD_IDENTITY_PROVIDER }}
        run: python3 .github/vid-cloud-cleanup/01a1d445/validate-existing-identity.py
      - name: Reuse the exact previously reviewed bootstrap libraries
        if: inputs.cleanup-mode != 'verify'
        run: python3 .github/vid-cloud-cleanup/01a1d445/setup-trusted-bootstrap.py
      - name: Run only the selected recorded cleanup mode
        run: python3 .github/vid-cloud-cleanup/01a1d445/run-cleanup-ci.py
      - name: Upload explicitly allowed noncredential receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vid-cloud-owned-cleanup-${{ github.run_id }}-${{ inputs.cleanup-mode }}
          path: .github/vid-cloud-cleanup/01a1d445/noncredential-receipts/
          if-no-files-found: ignore
          retention-days: 7
