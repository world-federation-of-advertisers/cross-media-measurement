name: Build and test

on:
  push:
    branches:
      - main
      - 'releases/**'
  pull_request:
    branches:
      - main
      - 'releases/**'
  workflow_dispatch:
    inputs:
      test_layout:
        description: Test layout (serial provides the comparison baseline)
        type: choice
        options:
          - parallel
          - serial
        default: parallel
      force_test_execution:
        description: Execute every test instead of accepting cached test results
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.test_layout || 'parallel' }}
  cancel-in-progress: true

env:
  FORCE_TEST_EXECUTION: ${{ inputs.force_test_execution && 'true' || 'false' }}
  CLUSTER_LOGS_PATH: cluster-logs

jobs:
  build:
    name: Build and plan tests
    if: ${{ inputs.test_layout != 'serial' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-ci
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Build
        run: >
          tools/bazel-with-results bazel build --worker_quit_after_build
          //...
          //src/main/k8s/local:cmms
          //src/main/k8s/dev:edp_simulators

      - name: Run workflow and deployment helper tests
        run: |
          python3 -m unittest discover -s src/test/github/workflows/scripts -p '*_test.py'
          python3 -m unittest discover -s src/test/terraform/gcloud/modules/http-cloud-function -p '*_test.py'

      - name: Plan test groups
        run: |
          bazel query 'tests(//...)' --output=xml > ci-test-query.xml
          python3 .github/workflows/scripts/ci_test_groups.py plan \
            --query=ci-test-query.xml --output=ci-test-groups

      - name: Upload test groups
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-test-groups
          path: ci-test-groups

  tests:
    name: Tests (${{ matrix.group }})
    # TODO(world-federation-of-advertisers/cross-media-measurement#3329): Re-enable coverage.
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        group: [remote, local-0, local-1, local-2, local-3]
    steps:
      - name: Check out revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-ci
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Download test groups
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ci-test-groups
          path: ci-test-groups

      - name: Run assigned tests
        env:
          TEST_GROUP: ${{ matrix.group }}
        run: >
          python3 .github/workflows/scripts/ci_test_groups.py run
          --targets-file="ci-test-groups/$TEST_GROUP.txt"
          --log-file="ci-results/$TEST_GROUP.log"
          --force-test-execution="$FORCE_TEST_EXECUTION"
          --test-output=errors

      - name: Upload test results
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.group }}
          path: |
            ci-results
            ci-test-groups
            bazel-testlogs

  correctness:
    name: Kubernetes correctness tests
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-ci
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Download test groups
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ci-test-groups
          path: ci-test-groups

      - name: Materialize local Kubernetes configurations
        run: >
          tools/bazel-with-results bazel build
          //src/main/k8s/local:cmms
          //src/main/k8s/dev:edp_simulators

      - uses: ./.github/actions/run-correctness-tests

      - name: Upload test results
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-correctness
          path: |
            ci-results
            ci-test-groups
            bazel-testlogs

  serial:
    name: Serial comparison baseline
    if: ${{ inputs.test_layout == 'serial' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-ci
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Build
        run: >
          tools/bazel-with-results bazel build --worker_quit_after_build
          //...
          //src/main/k8s/local:cmms
          //src/main/k8s/dev:edp_simulators

      - name: Run workflow and deployment helper tests
        run: |
          python3 -m unittest discover -s src/test/github/workflows/scripts -p '*_test.py'
          python3 -m unittest discover -s src/test/terraform/gcloud/modules/http-cloud-function -p '*_test.py'

      - name: Plan test groups
        run: |
          bazel query 'tests(//...)' --output=xml > ci-test-query.xml
          python3 .github/workflows/scripts/ci_test_groups.py plan \
            --query=ci-test-query.xml --output=ci-test-groups

      - name: Run all tests
        run: >
          python3 .github/workflows/scripts/ci_test_groups.py run
          --targets-file=ci-test-groups/all.txt
          --log-file=ci-results/all.log
          --force-test-execution="$FORCE_TEST_EXECUTION"
          --test-output=errors

      - uses: ./.github/actions/run-correctness-tests

      - name: Upload test results
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-serial
          path: |
            ci-results
            ci-test-groups
            bazel-testlogs

  build-test:
    name: ${{ inputs.test_layout == 'serial' && 'Serial baseline result' || 'Build and test' }}
    if: ${{ always() }}
    needs: [build, tests, correctness, serial]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          TEST_LAYOUT: ${{ inputs.test_layout || 'parallel' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["JOB_RESULTS"])
          expected = ["serial"] if os.environ["TEST_LAYOUT"] == "serial" else ["build", "tests", "correctness"]
          failed = [job for job in expected if results[job]["result"] != "success"]
          if failed:
              sys.exit("Required CI jobs did not succeed: " + ", ".join(failed))
          PY
