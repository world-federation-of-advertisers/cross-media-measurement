name: Prepare CMMS Terraform inputs
description: Download and validate the immutable inputs for a CMMS rollout
inputs:
  environment:
    description: CMMS environment
    required: true
  image-tag:
    description: Published artifact version
    required: true
  packages-token:
    description: GitHub Packages read token
    required: true
outputs:
  data_watcher_source_path:
    description: "Prepared data watcher Uber JAR"
    value: ${{ steps.download-uber-jars.outputs.data_watcher_source_path }}
  requisition_fetcher_source_path:
    description: "Prepared requisition fetcher Uber JAR"
    value: ${{ steps.download-uber-jars.outputs.requisition_fetcher_source_path }}
  event_group_sync_source_path:
    description: "Prepared event group sync Uber JAR"
    value: ${{ steps.download-uber-jars.outputs.event_group_sync_source_path }}
  data_availability_sync_source_path:
    description: "Prepared data availability sync Uber JAR"
    value: ${{ steps.download-uber-jars.outputs.data_availability_sync_source_path }}
  data_availability_cleanup_source_path:
    description: "Prepared data availability cleanup Uber JAR"
    value: ${{ steps.download-uber-jars.outputs.data_availability_cleanup_source_path }}
  data_availability_monitor_source_path:
    description: "Prepared data availability monitor Uber JAR"
    value: ${{ steps.download-uber-jars.outputs.data_availability_monitor_source_path }}
  vid_labeling_dispatcher_source_path:
    description: "Prepared vid labeling dispatcher Uber JAR"
    value: ${{ steps.download-uber-jars.outputs.vid_labeling_dispatcher_source_path }}
  vid_labeling_monitor_source_path:
    description: "Prepared vid labeling monitor Uber JAR"
    value: ${{ steps.download-uber-jars.outputs.vid_labeling_monitor_source_path }}
  vid_labeling_healing_controller_source_path:
    description: "Prepared vid labeling healing controller Uber JAR"
    value: ${{ steps.download-uber-jars.outputs.vid_labeling_healing_controller_source_path }}
  dashboard_compliance_check_source_path:
    description: "Prepared dashboard compliance check Uber JAR"
    value: ${{ steps.download-uber-jars.outputs.dashboard_compliance_check_source_path }}
  event_proto_descriptors_path:
    description: "Test event descriptors"
    value: ${{ steps.build-test-event-descriptors.outputs.event_proto_descriptors_path }}
runs:
  using: composite
  steps:
    - name: Set up Java & Maven
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
      with:
        distribution: zulu
        java-version: '17'

    - name: Set up Maven GitHub Packages auth
      shell: bash
      run: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml <<EOF
        <settings>
          <mirrors>
            <mirror>
              <id>google-maven-central</id>
              <url>https://maven-central.storage-download.googleapis.com/maven2</url>
              <mirrorOf>central</mirrorOf>
            </mirror>
          </mirrors>
          <servers>
            <server>
              <id>github</id>
              <username>${{ github.actor }}</username>
              <password>${{ inputs.packages-token }}</password>
            </server>
          </servers>
        </settings>
        EOF

    - id: get-artifact-version
      uses: ./.github/actions/get-maven-artifact-version
      with:
        package-version: ${{ inputs.image-tag }}

    - name: Download Uber JARs using Maven
      id: download-uber-jars
      env:
        ARTIFACT_VERSION: ${{ steps.get-artifact-version.outputs.artifact-version }}
      shell: bash
      run: |
        set -euo pipefail
        TEMP_DIR="${RUNNER_TEMP}/uber-jars"
        mkdir -p "$TEMP_DIR"
        LOCAL_REPO="$RUNNER_TEMP/maven-repository"
        echo "Maven repo: $LOCAL_REPO"

        declare -A coords
        coords[data-watcher]="org.wfanet.measurement.securecomputation.deploy.gcloud.datawatcher:data-watcher:$ARTIFACT_VERSION:jar"
        coords[requisition-fetcher]="org.wfanet.measurement.edpaggregator.deploy.gcloud.requisitionfetcher:requisition-fetcher:$ARTIFACT_VERSION:jar"
        coords[event-group-sync]="org.wfanet.measurement.edpaggregator.deploy.gcloud.eventgroups:event-group-sync:$ARTIFACT_VERSION:jar"
        coords[data-availability-sync]="org.wfanet.measurement.edpaggregator.deploy.gcloud.dataavailability:data-availability-sync:$ARTIFACT_VERSION:jar"
        coords[data-availability-cleanup]="org.wfanet.measurement.edpaggregator.deploy.gcloud.dataavailability:data-availability-cleanup:$ARTIFACT_VERSION:jar"
        coords[data-availability-monitor]="org.wfanet.measurement.edpaggregator.deploy.gcloud.dataavailability:data-availability-monitor:$ARTIFACT_VERSION:jar"
        coords[vid-labeling-dispatcher]="org.wfanet.measurement.edpaggregator.deploy.gcloud.vidlabeling:vid-labeling-dispatcher:$ARTIFACT_VERSION:jar"
        coords[vid-labeling-monitor]="org.wfanet.measurement.edpaggregator.deploy.gcloud.vidlabeling:vid-labeling-monitor:$ARTIFACT_VERSION:jar"
        coords[vid-labeling-healing-controller]="org.wfanet.measurement.edpaggregator.deploy.gcloud.vidlabeling:vid-labeling-healing-controller:$ARTIFACT_VERSION:jar"
        coords[dashboard-compliance-check]="org.wfanet.measurement.edpaggregator.deploy.gcloud.dashboard.tools:dashboard-compliance-check:$ARTIFACT_VERSION:jar"

        for key in "${!coords[@]}"; do
          dest_dir="$TEMP_DIR/$key"
          mkdir -p "$dest_dir"
          # Uber JARs already contain their runtime dependencies.
          mvn -B -U -Dmaven.repo.local="$LOCAL_REPO" \
            org.apache.maven.plugins:maven-dependency-plugin:3.11.0:get \
            -DremoteRepositories=github::default::https://maven.pkg.github.com/world-federation-of-advertisers/cross-media-measurement \
            -Dartifact="${coords[$key]}" \
            -Dtransitive=false

          IFS=':' read -r groupId artifactId version type <<<"${coords[$key]}"
          jar_dir="$LOCAL_REPO/${groupId//./\/}/$artifactId/$version"
          # Maven installs timestamped SNAPSHOTs with the base-version filename.
          jar_path="$jar_dir/$artifactId-$version.jar"
          filename="${version}-function.jar"
          cp "$jar_path" "$dest_dir/$filename"

          safe_key=${key//-/_}
          echo "${safe_key}_source_path=$dest_dir/$filename" >> "$GITHUB_OUTPUT"
        done

    - name: Build test event proto descriptors
      id: build-test-event-descriptors
      env:
        BAZEL_TARGET_LABEL: "//src/main/proto/wfa/measurement/api/v2alpha/event_templates/testing/v1:test_event_descriptor_set"
      shell: bash
      run: |
        tools/bazel-with-results bazelisk build "$BAZEL_TARGET_LABEL"
        RELATIVE_PROTO_DESCRIPTORS_PATH=$(bazelisk cquery "$BAZEL_TARGET_LABEL" --output=files)
        ABSOLUTE_PROTO_DESCRIPTORS_PATH="$(realpath "$RELATIVE_PROTO_DESCRIPTORS_PATH")"
        echo "event_proto_descriptors_path=$ABSOLUTE_PROTO_DESCRIPTORS_PATH" >> "$GITHUB_OUTPUT"

    - name: Generate and copy trusted certs
      shell: bash
      run: |
        tools/bazel-with-results bazelisk build //src/main/k8s/testing/secretfiles:gen_trusted_certs
        cp bazel-bin/src/main/k8s/testing/secretfiles/all_root_certs.pem src/main/k8s/testing/secretfiles/

    - name: Validate DataWatcher configuration
      env:
        CONFIG_DIR: ${{ github.workspace }}/src/main/terraform/gcloud/cmms/envs/${{ inputs.environment }}
      shell: bash
      run: |
        bazelisk run \
          //src/main/kotlin/org/wfanet/measurement/securecomputation/deploy/gcloud/datawatcher:ValidateDataWatcherConfig \
          -- \
          --data-watcher-config="$CONFIG_DIR/data-watcher-config.textproto"

    - name: Validate direct RequisitionFetcher dispatch configuration
      env:
        CONFIG_DIR: ${{ github.workspace }}/src/main/terraform/gcloud/cmms/envs/${{ inputs.environment }}
      shell: bash
      run: |
        bazelisk run \
          //src/main/kotlin/org/wfanet/measurement/edpaggregator/deploy/gcloud/requisitionfetcher:ValidateRequisitionFetcherConfig \
          -- \
          --requisition-fetcher-config="$CONFIG_DIR/requisition-fetcher-config.textproto" \
          --data-watcher-config="$CONFIG_DIR/data-watcher-config.textproto" \
          --control-plane-target="$SECURE_COMPUTATION_PUBLIC_API_TARGET"
