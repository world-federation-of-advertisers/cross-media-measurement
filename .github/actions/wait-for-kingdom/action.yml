name: Wait for Kingdom public API
description: Waits for a new mTLS gRPC connection to the Kingdom public API
inputs:
  kingdom-public-api-target:
    description: gRPC target for the Kingdom public API
    required: true
  kingdom-public-api-cert-host:
    description: Expected hostname in the Kingdom public API TLS certificate
    required: true
  model-line-name:
    description: ModelLine resource name used to probe the API
    required: true
  max-attempts:
    description: Maximum number of new gRPC connection attempts
    default: "6"
  attempt-timeout-seconds:
    description: Timeout for each gRPC attempt
    default: "30"
  retry-delay-seconds:
    description: Delay between gRPC attempts
    default: "15"

runs:
  using: composite
  steps:
  - name: Build MeasurementSystem API tool
    shell: bash
    run: >-
      bazelisk build
      //src/main/kotlin/org/wfanet/measurement/api/v2alpha/tools:MeasurementSystem

  - name: Wait for Kingdom public API
    shell: bash
    env:
      ATTEMPT_TIMEOUT_SECONDS: ${{ inputs.attempt-timeout-seconds }}
      KINGDOM_PUBLIC_API_CERT_HOST: ${{ inputs.kingdom-public-api-cert-host }}
      KINGDOM_PUBLIC_API_TARGET: ${{ inputs.kingdom-public-api-target }}
      MAX_ATTEMPTS: ${{ inputs.max-attempts }}
      MODEL_LINE_NAME: ${{ inputs.model-line-name }}
      RETRY_DELAY_SECONDS: ${{ inputs.retry-delay-seconds }}
    run: |
      model_suite_name="${MODEL_LINE_NAME%/modelLines/*}"
      if [[ "$model_suite_name" == "$MODEL_LINE_NAME" ]]; then
        echo "Invalid ModelLine resource name: $MODEL_LINE_NAME" >&2
        exit 1
      fi

      bazel_bin="$(bazelisk info bazel-bin)"
      measurement_system="$bazel_bin/src/main/kotlin/org/wfanet/measurement/api/v2alpha/tools/MeasurementSystem"
      output_file="$RUNNER_TEMP/kingdom-readiness.log"
      cert_host_args=()
      if [[ -n "$KINGDOM_PUBLIC_API_CERT_HOST" ]]; then
        cert_host_args+=(
          "--kingdom-public-api-cert-host=$KINGDOM_PUBLIC_API_CERT_HOST"
        )
      fi

      for ((attempt = 1; attempt <= MAX_ATTEMPTS; attempt++)); do
        echo "Kingdom API readiness attempt $attempt of $MAX_ATTEMPTS"
        if timeout "${ATTEMPT_TIMEOUT_SECONDS}s" "$measurement_system" \
          --tls-cert-file=src/main/k8s/testing/secretfiles/mp1_tls.pem \
          --tls-key-file=src/main/k8s/testing/secretfiles/mp1_tls.key \
          --cert-collection-file=src/main/k8s/testing/secretfiles/kingdom_root.pem \
          --kingdom-public-api-target="$KINGDOM_PUBLIC_API_TARGET" \
          "${cert_host_args[@]}" \
          model-lines list --parent="$model_suite_name" \
          > "$output_file" 2>&1; then
          echo "Kingdom public API accepted a new gRPC connection."
          exit 0
        fi

        if ((attempt == MAX_ATTEMPTS)); then
          cat "$output_file" >&2
          echo "Kingdom public API did not become ready." >&2
          exit 1
        fi
        sleep "$RETRY_DELAY_SECONDS"
      done
