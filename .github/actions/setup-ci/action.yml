name: Set up CI
description: Configure Bazel and runner resources consistently for CI jobs
inputs:
  buildbuddy-api-key:
    description: BuildBuddy API key
    required: true
runs:
  using: composite
  steps:
    - name: Validate committed CMMS environment configuration
      shell: bash
      run: |
        set -euo pipefail
        reference_keys=$(jq -cS 'keys' .github/env-configs/dev/cmms.json)
        for env_name in dev head qa; do
          config_path=".github/env-configs/$env_name/cmms.json"
          jq -e '
            type == "object"
            and length > 0
            and (to_entries | all(.key | test("^[A-Z][A-Z0-9_]*$")))
            and (to_entries | all(.value |
              type == "string" and length > 0 and (contains("\n") | not)))
          ' "$config_path" > /dev/null
          test "$(jq -cS 'keys' "$config_path")" = "$reference_keys"
          jq -e '
            has("WORKLOAD_IDENTITY_PROVIDER")
            and has("TF_SERVICE_ACCOUNT")
            and has("GKE_CONFIG_SERVICE_ACCOUNT")
          ' "$config_path" > /dev/null
        done

        {
          grep -rhoE 'fromJSON\(steps\.cmms-config\.outputs\.config\)\.[A-Z][A-Z0-9_]*' .github/workflows \
            | sed 's/.*\.//'
          printf '%s\n' \
            EDP1_NAME EDP1_CERT_NAME EDP2_NAME EDP2_CERT_NAME \
            EDP3_NAME EDP3_CERT_NAME EDP4_NAME EDP4_CERT_NAME \
            EDP5_NAME EDP5_CERT_NAME EDP6_NAME EDP6_CERT_NAME
        } | sort -u | while IFS= read -r config_key; do
          jq -e --arg key "$config_key" 'has($key)' \
            .github/env-configs/dev/cmms.json > /dev/null
        done

    - name: Set up Bazel
      uses: world-federation-of-advertisers/actions/setup-bazel@390a9ea948eef416333f8c257ef6116552a42d23 # v2.6.0

    - uses: ./.github/actions/free-disk-space

    - name: Write auth.bazelrc
      env:
        BUILDBUDDY_API_KEY: ${{ inputs.buildbuddy-api-key }}
      shell: bash
      run: |
        cat << EOF > auth.bazelrc
        build --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY
        EOF

    - name: Write ~/.bazelrc
      shell: bash
      run: |
        cat << EOF > ~/.bazelrc
        common --config=ci
        build --remote_upload_local_results
        build --define container_registry=localhost:5001
        build --define image_repo_prefix=halo
        build --define image_tag=latest
        build --define kingdom_public_api_target=kingdom.example.com:8443
        build --define worker1_id=worker1
        build --define worker1_cert_name=duchies/worker1/certificates/foo
        build --define worker1_public_api_target=worker1.example.com:8443
        build --define worker2_id=worker2
        build --define worker2_cert_name=duchies/worker2/certificates/foo
        build --define worker2_public_api_target=worker2.example.com:8443
        build --define aggregator_id=aggregator
        build --define aggregator_cert_name=duchies/aggregator/certificates/foo
        build --define aggregator_public_api_target=aggregator.example.com:8443
        build --define mc_name=measurementConsumers/foo
        build --define mc_api_key=foo
        build --define mc_cert_name=measurementConsumers/foo/certificates/bar
        build --define edp1_name=dataProviders/foo1
        build --define edp1_cert_name=dataProviders/foo1/certificates/bar1
        build --define edp2_name=dataProviders/foo2
        build --define edp2_cert_name=dataProviders/foo2/certificates/bar2
        build --define edp3_name=dataProviders/foo3
        build --define edp3_cert_name=dataProviders/foo3/certificates/bar3
        build --define edp4_name=dataProviders/foo4
        build --define edp4_cert_name=dataProviders/foo4/certificates/bar4
        build --define edp5_name=dataProviders/foo5
        build --define edp5_cert_name=dataProviders/foo5/certificates/bar5
        build --define edp6_name=dataProviders/foo6
        build --define edp6_cert_name=dataProviders/foo6/certificates/bar6
        build --define pdp_name=dataProviders/foodp1
        build --define pdp_cert_name=dataProviders/foodp1/certificates/bar1
        build --define google_cloud_project=example-project
        build --define google_cloud_project_number=12345
        build --define key_ring_location=us-central1
        build --define basic_reports_enabled=true
        build --define reporting_set_reporting_unit_components_enabled=true
        EOF

    # Reduce chance of disconnection from the Build Event Service.
    - name: Set TCP keepalive
      shell: bash
      run: sudo sysctl -w net.ipv4.tcp_keepalive_time=60

    - name: Check lockfile
      shell: bash
      run: bazel mod deps

